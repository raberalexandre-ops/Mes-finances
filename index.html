<title>Finances</title>
<style>

  .pa-cell b { font-size: 17px; } .pa-cell small { font-size: 12px; opacity: .85; margin-top: 4px; }

  .hero.stats { background: linear-gradient(180deg, #e0776a 0%, #cf6a5c 50%, #b05649 100%); }
  .statseg { display: flex; width: 100%; background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.3); border-radius: 30px; padding: 5px; }
  .statseg button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.88); font-size: 13px; font-weight: 700; padding: 11px 0; border-radius: 24px; cursor: pointer; }
  .statseg button.on { background: #fff; color: #1c130c; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  #heroStat { padding-top: 22px; }
  .st-card { background: #fff; border-radius: 24px; padding: 11px; box-shadow: 0 2px 10px rgba(120,100,60,0.08); margin-bottom: 13px; }
  .st-tog { display: flex; background: #f0ebe0; border-radius: 28px; padding: 5px; }

  .st-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 10px 2px; }

  .st-delta { display: flex; align-items: center; gap: 14px; padding: 10px 10px 0; }

  .st-delta .ar.bad { background: #fbe3e0; color: #c0392b; } .st-delta .ar.good { background: #dff0e3; color: #2a7a46; }
  .st-delta b { display: block; font-size: 18px; } .st-delta b.bad { color: #c0392b; } .st-delta b.good { color: #2a7a46; } .st-delta span { color: #8a7b66; font-size: 14px; }
  .st-bars { display: flex; align-items: flex-end; height: 160px; margin: 14px 6px 0; gap: 2px; }

  .st-bars.inc i { background: #3a8f5c; } .st-bars i.z { height: 3px !important; background: #eee7d8; }
  .st-bars { touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: pointer; }
  .st-bars .c { border-radius: 12px; transition: background .1s; } .st-bars .c.sel { background: #ebe3d1; box-shadow: 0 0 0 3px #ebe3d1; }
  .st-det-h { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 8px 10px; font-size: 17px; font-weight: 800; color: #3d2f1e; }
  .st-det-h b.exp { color: #c0392b; } .st-det-h b.inc { color: #2a7a46; }
  .st-dr { display: flex; align-items: center; gap: 12px; padding: 4px 8px; }

  .st-x { display: flex; margin: 8px 6px 4px; } .st-x span { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; color: #8a7b66; white-space: nowrap; overflow: visible; }
  .st-tree { position: relative; height: 430px; border-radius: 20px; overflow: hidden; margin: 0; }
  .st-cell { position: absolute; padding: 3px; box-sizing: border-box; }
  .st-cell > div { width: 100%; height: 100%; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; overflow: hidden; padding: 4px; box-sizing: border-box; }
  .st-cell b { font-size: 14px; } .st-cell small { font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 6px; }

  .seg2 { display: flex; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); border-radius: 24px; padding: 4px; }

  .main { margin-top: -30px; position: relative; padding-bottom: 130px; }

  /* ---------- Cards ---------- */
  .kc-card { background: #fff; border-radius: 22px; padding: 16px 14px; margin: 0 11px 11px; box-shadow: 0 6px 22px rgba(40,50,30,0.07); }

  .kc-lb { font-size: 9px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-dim); }

  .kc-title { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #5a4b3e; margin: 6px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
  .kc-title button { background: none; border: none; color: var(--accent); font-size: 9px; font-weight: 700; cursor: pointer; text-transform: none; letter-spacing: 0; }

  /* ---------- Calendar ---------- */

  .kc-day.exp { background: #fbe4e1; }

// ---------- Date helpers ----------
function parseKey(key) { return new Date(key + 'T00:00:00'); }
function fmtKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey() { return fmtKey(new Date()); }
function fmtAmount(n) { const s = Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? '-' : '') + s; }
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function signedAmount(t) { return t.type === 'income' ? t.amount : -t.amount; }
function fmtMonthLabel(d) { return d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
function fmtDayLabel(d) {
  const key = fmtKey(d);
  if (key === todayKey()) return "Aujourd'hui";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (key === fmtKey(y)) return "Hier";
  const t = new Date(); t.setDate(t.getDate() + 1);
  if (key === fmtKey(t)) return "Demain";
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function daysUntil(key) { return Math.round((parseKey(key) - parseKey(todayKey())) / 86400000); }
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

// ---------- Storage (localStorage — saves directly on this device/browser, no account needed) ----------
async function loadAll() {
  try {
    const raw = localStorage.getItem('fin_transactions');
    state.transactions = raw ? JSON.parse(raw) : [];
  } catch (e) { state.transactions = []; }
  try {
    const raw2 = localStorage.getItem('fin_scheduled');
    state.scheduled = raw2 ? JSON.parse(raw2) : [];
  } catch (e) { state.scheduled = []; }
  try {
    const raw3 = localStorage.getItem('fin_balance_start');
    state.balanceStart = raw3 ? parseFloat(raw3) : 0;
  } catch (e) { state.balanceStart = 0; }
  try {
    const rawE = localStorage.getItem('fin_expense_cats');
    if (rawE) {
      state.expenseCats = JSON.parse(rawE);
    } else {
      // first run (or migrating from the old custom-categories model)
      let migrated = [];
      try {
        const oldCustom = localStorage.getItem('fin_custom_cats');
        if (oldCustom) migrated = (JSON.parse(oldCustom).expense || []);
      } catch (e) {}
      state.expenseCats = [...DEFAULT_EXPENSE_CATEGORIES, ...migrated];
    }
  } catch (e) { state.expenseCats = [...DEFAULT_EXPENSE_CATEGORIES]; }
  try {
    const rawI = localStorage.getItem('fin_income_cats');
    if (rawI) {
      state.incomeCats = JSON.parse(rawI);
    } else {
      let migrated = [];
      try {
        const oldCustom = localStorage.getItem('fin_custom_cats');
        if (oldCustom) migrated = (JSON.parse(oldCustom).income || []);
      } catch (e) {}
      state.incomeCats = [...DEFAULT_INCOME_CATEGORIES, ...migrated];
    }
  } catch (e) { state.incomeCats = [...DEFAULT_INCOME_CATEGORIES]; }

  try { state.budgets = JSON.parse(localStorage.getItem('fin_budgets') || '{}') || {}; } catch (e) { state.budgets = {}; }
  // groupes personnalisés
  try {
    const cg = JSON.parse(localStorage.getItem('fin_groups') || '[]') || [];
    state.groups = cg;
    cg.forEach(g => { if (!GROUPS.some(x => x.id === g.id)) { g.icon = ci(g.ico); GROUPS.splice(GROUPS.length - 1, 0, g); } });
  } catch (e) { state.groups = []; }
  // migration vers la nouvelle base de catégories (v2) + icônes SVG
  try {
    if (localStorage.getItem('fin_cats_v2') !== '1') {
      const oldIds = new Set(Object.keys(OLD_CAT_MAP));
      const newIds = new Set(DEFAULT_EXPENSE_CATEGORIES.map(c => c.id));
      const custom = state.expenseCats.filter(c => c && !oldIds.has(c.id) && !newIds.has(c.id));
      state.expenseCats = [...DEFAULT_EXPENSE_CATEGORIES.map(c => ({ ...c })), ...custom];
      const mp = id => OLD_CAT_MAP[id] || id;
      state.transactions.forEach(t => { if (t.cat) t.cat = mp(t.cat); });
      state.scheduled.forEach(t => { if (t.cat) t.cat = mp(t.cat); });
      const nb = {};
      Object.entries(state.budgets).forEach(([k, v]) => {
        const c = state.expenseCats.find(x => x.id === mp(k));
        const g = c ? grpOf(c) : (GROUPS.some(x => x.id === k) ? k : 'divers');
        nb[g] = (nb[g] || 0) + v;
      });
      state.budgets = nb;
      localStorage.setItem('fin_transactions', JSON.stringify(state.transactions));
      localStorage.setItem('fin_scheduled', JSON.stringify(state.scheduled));
      localStorage.setItem('fin_budgets', JSON.stringify(state.budgets));
      localStorage.setItem('fin_expense_cats', JSON.stringify(state.expenseCats));
      localStorage.setItem('fin_cats_v2', '1');
    }
  } catch (e) {}
  try {
    if (localStorage.getItem('fin_cats_v3') !== '1') {
      if (!state.expenseCats.some(c => c.id === 'epargne')) {
        const d = DEFAULT_EXPENSE_CATEGORIES.find(c => c.id === 'epargne');
        const k = state.expenseCats.findIndex(c => c.id === 'divers');
        state.expenseCats.splice(k < 0 ? state.expenseCats.length : k, 0, { ...d });
        localStorage.setItem('fin_expense_cats', JSON.stringify(state.expenseCats));
      }
      localStorage.setItem('fin_cats_v3', '1');
    }
  } catch (e) {}
  // icônes SVG (à jour à chaque chargement)
  [state.expenseCats, state.incomeCats].forEach(list => list.forEach(c => {
    const def = DEFAULT_EXPENSE_CATEGORIES.concat(DEFAULT_INCOME_CATEGORIES).find(d => d.id === c.id);
    if (def) { c.ico = def.ico; c.icon = def.icon; if (def.grp) c.grp = def.grp; }
    else if (!String(c.icon || '').startsWith('<svg')) { c.ico = 'tag'; c.icon = ci('tag'); }
    else c.icon = ci(c.ico || 'tag');
  }));
  try { state.goals = JSON.parse(localStorage.getItem('fin_goals') || '[]') || []; } catch (e) { state.goals = []; }
  try { state.accounts = JSON.parse(localStorage.getItem('fin_accounts') || '[]') || []; } catch (e) { state.accounts = []; }
  try { state.transfers = JSON.parse(localStorage.getItem('fin_transfers') || '[]') || []; } catch (e) { state.transfers = []; }

  // Remap the old mustard/yellow category colors that may be saved on this device
  const LEGACY_YELLOWS = ['#e0b64f', '#c99a4b'];
  [...state.expenseCats, ...state.incomeCats].forEach(c => {
    if (c && LEGACY_YELLOWS.includes((c.color || '').toLowerCase())) {
      c.color = c.id === 'tips' ? '#e0804a' : '#d6bfa6';
    }
  });
}

// ---------- Analyses (calculées localement) ----------
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function euro(n) { return fmtAmount(n) + ' €'; }
function shortDate(k) { return parseKey(k).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
function monthName(y, m) { return new Date(y, m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }

function getRange(period) {
  const now = new Date();
  if (period === 'week') {
    const s = new Date(now); s.setDate(s.getDate() - 6);
    const ps = new Date(now); ps.setDate(ps.getDate() - 13);
    const pe = new Date(now); pe.setDate(pe.getDate() - 7);
    return { start: fmtKey(s), end: todayKey(), label: 'les 7 derniers jours', prevStart: fmtKey(ps), prevEnd: fmtKey(pe), prevLabel: 'les 7 jours précédents' };
  }
  const off = period === 'lastmonth' ? -1 : 0;
  const first = new Date(now.getFullYear(), now.getMonth() + off, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + off + 1, 0);
  const pf = new Date(now.getFullYear(), now.getMonth() + off - 1, 1);
  const pl = new Date(now.getFullYear(), now.getMonth() + off, 0);
  return { start: fmtKey(first), end: fmtKey(last), label: monthName(first.getFullYear(), first.getMonth()),
           prevStart: fmtKey(pf), prevEnd: fmtKey(pl), prevLabel: monthName(pf.getFullYear(), pf.getMonth()) };
}
function txIn(start, end, type) {
  return state.transactions.filter(t => t.date >= start && t.date <= end && (!type || t.type === type));
}
function sumTx(list) { return list.reduce((s, t) => s + t.amount, 0); }
function groupByCat(list) {
  const g = {};
  list.forEach(t => { g[t.cat] = (g[t.cat] || 0) + t.amount; });
  return Object.entries(g).map(([id, total]) => ({ cat: findCat(id), total })).sort((a, b) => b.total - a.total);
}
function bar(pct, color) {
  return `<div class="a-bar"><div style="width:${Math.max(2, Math.min(100, pct))}%;background:${color}"></div></div>`;
}
function p(html) { return `<p>${html}</p>`; }
function emptyMsg(txt) { return p(txt); }

function ansSpending(period, type) {
  const r = getRange(period);
  const list = txIn(r.start, r.end, type);
  const isInc = type === 'income';
  if (!list.length) return emptyMsg(`Je ne trouve aucune ${isInc ? 'recette' : 'dépense'} enregistrée sur <b>${r.label}</b>.`);
  const total = sumTx(list);
  const groups = groupByCat(list);
  let h = p(`Sur <b>${r.label}</b>, ${isInc ? 'tu as encaissé' : 'tu as dépensé'} <b>${euro(total)}</b> en ${list.length} opération${list.length > 1 ? 's' : ''}.`);
  h += '<div class="a-rows">' + groups.map(g => {
    const pct = g.total / total * 100;
    return `<div class="a-row"><div class="a-row-top"><span>${g.cat.icon} ${escapeHtml(g.cat.label)}</span><span><b>${euro(g.total)}</b> <i>${Math.round(pct)} %</i></span></div>${bar(pct, darkenColor(g.cat.color, 0.85))}</div>`;
  }).join('') + '</div>';
  const top = groups[0];
  h += p(`${top.cat.icon} <b>${escapeHtml(top.cat.label)}</b> représente à lui seul ${Math.round(top.total / total * 100)} % ${isInc ? 'de tes recettes' : 'de tes dépenses'}.`);
  if (!isInc) {
    const inc = sumTx(txIn(r.start, r.end, 'income'));
    if (inc > 0) h += p(`Recettes sur la période : <b>${euro(inc)}</b> → solde net <b class="${inc - total >= 0 ? 'pos' : 'neg'}">${inc - total >= 0 ? '+' : ''}${euro(inc - total)}</b>.`);
  }
  return h;
}

function upcomingUntil(endKey) {
  const out = [];
  state.scheduled.forEach(item => occurrencesInWindow(item, endKey).forEach(date => out.push({ p: item, date })));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function dueRows(list) {
  return '<div class="a-rows">' + list.map(({ p: it, date }) => {
    const cat = findCat(it.cat); const inc = it.type === 'income';
    return `<div class="a-row"><div class="a-row-top"><span>${cat.icon} ${escapeHtml(it.label || cat.label)} <i>${shortDate(date)}</i></span><span><b class="${inc ? 'pos' : ''}">${inc ? '+' : '-'}${euro(it.amount)}</b></span></div></div>`;
  }).join('') + '</div>';
}
function ansUpcoming() {
  const now = new Date();
  const endKey = fmtKey(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  const list = upcomingUntil(endKey);
  if (!list.length) return emptyMsg(`Aucun paiement ni encaissement prévu d'ici la fin de <b>${monthName(now.getFullYear(), now.getMonth())}</b>.`);
  const out = list.filter(o => o.p.type !== 'income').reduce((s, o) => s + o.p.amount, 0);
  const inn = list.filter(o => o.p.type === 'income').reduce((s, o) => s + o.p.amount, 0);
  let h = p(`D'ici la fin du mois, <b>${list.length}</b> opération${list.length > 1 ? 's' : ''} à venir : <b>${euro(out)}</b> à payer${inn ? ` et <b>${euro(inn)}</b> à encaisser` : ''}.`);
  h += dueRows(list);
  const proj = computeProjection();
  h += p(`Solde actuel <b>${euro(state.balanceStart)}</b> → prévisionnel fin de mois <b class="${proj >= 0 ? 'pos' : 'neg'}">${euro(proj)}</b>.`);
  return h;
}
function ansBalance() {
  const proj = computeProjection();
  const diff = proj - state.balanceStart;
  return p(`Ton solde actuel est de <b>${euro(state.balanceStart)}</b>.`) +
    p(`En tenant compte des opérations prévues jusqu'à la fin du mois (${diff >= 0 ? '+' : ''}${euro(diff)}), il devrait être de <b class="${proj >= 0 ? 'pos' : 'neg'}">${euro(proj)}</b>.`) +
    (proj < 0 ? p('⚠️ Attention : le prévisionnel passe en négatif avant la fin du mois.') : '');
}

function medianOf(arr) { const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function ansAnomalies() {
  const findings = [];
  const exp = state.transactions.filter(t => t.type === 'expense');
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 60);
  const cutKey = fmtKey(cutoff);
  // 1. doublons
  const recent = exp.filter(t => t.date >= cutKey).sort((a, b) => a.date.localeCompare(b.date));
  const seen = new Set();
  for (let i = 0; i < recent.length; i++) for (let j = i + 1; j < recent.length; j++) {
    const a = recent[i], b = recent[j];
    if (a.cat === b.cat && a.amount === b.amount && norm(a.note) === norm(b.note) &&
        Math.abs(parseKey(a.date) - parseKey(b.date)) <= 3 * 86400000 && !seen.has(a.id) && !seen.has(b.id)) {
      seen.add(a.id); seen.add(b.id);
      const c = findCat(a.cat);
      findings.push(`🔁 <b>Doublon possible</b> : ${c.icon} ${escapeHtml(a.note || c.label)}, ${euro(a.amount)} le ${shortDate(a.date)}${a.date !== b.date ? ' et le ' + shortDate(b.date) : ' (deux fois)'}.`);
    }
  }
  // 2. montants inhabituels
  const byCat = {};
  exp.forEach(t => (byCat[t.cat] = byCat[t.cat] || []).push(t));
  const cut2 = new Date(); cut2.setDate(cut2.getDate() - 35); const cut2Key = fmtKey(cut2);
  Object.values(byCat).forEach(list => {
    if (list.length < 4) return;
    const med = medianOf(list.map(t => t.amount));
    list.filter(t => t.date >= cut2Key && t.amount >= 20 && t.amount > med * 2.5).forEach(t => {
      const c = findCat(t.cat);
      findings.push(`📈 <b>Montant inhabituel</b> : ${c.icon} ${euro(t.amount)} en ${escapeHtml(c.label)} le ${shortDate(t.date)} (médiane habituelle : ${euro(med)}).`);
    });
  });
  // 3. hausses sur dépenses récurrentes (même libellé)
  const byNote = {};
  exp.filter(t => t.note && t.note.trim()).forEach(t => (byNote[norm(t.note)] = byNote[norm(t.note)] || []).push(t));
  Object.values(byNote).forEach(list => {
    if (list.length < 2) return;
    list.sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts);
    const last = list[list.length - 1], prev = list[list.length - 2];
    if (last.amount > prev.amount * 1.05 && last.date !== prev.date) {
      findings.push(`⬆️ <b>Hausse</b> : « ${escapeHtml(last.note)} » est passé de ${euro(prev.amount)} à ${euro(last.amount)} (+${Math.round((last.amount / prev.amount - 1) * 100)} %).`);
    }
  });
  // 4. opérations à venir en retard
  const late = state.scheduled.filter(it => it.nextDate < todayKey());
  late.forEach(it => findings.push(`⏰ <b>En retard</b> : « ${escapeHtml(it.label || findCat(it.cat).label)} » (${euro(it.amount)}) était prévu le ${shortDate(it.nextDate)} et n'est pas marqué comme réalisé.`));
  if (!findings.length) return p('✅ Je n\'ai rien trouvé d\'anormal : pas de doublon, pas de montant inhabituel, pas de hausse sur tes dépenses récurrentes.');
  return p(`J'ai relevé <b>${findings.length}</b> point${findings.length > 1 ? 's' : ''} à vérifier :`) + '<ul class="a-list">' + findings.map(f => `<li>${f}</li>`).join('') + '</ul>';
}

function ansCompare() {
  const now = new Date();
  const day = now.getDate();
  const cs = fmtKey(new Date(now.getFullYear(), now.getMonth(), 1));
  const ps = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const pLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  const pe = new Date(ps.getFullYear(), ps.getMonth(), Math.min(day, pLastDay));
  const cur = txIn(cs, todayKey(), 'expense');
  const prev = txIn(fmtKey(ps), fmtKey(pe), 'expense');
  const tc = sumTx(cur), tp = sumTx(prev);
  if (!cur.length && !prev.length) return emptyMsg('Pas encore assez de données pour comparer deux périodes.');
  const pn = monthName(ps.getFullYear(), ps.getMonth());
  let h = p(`Du 1<sup>er</sup> au ${day}, tu as dépensé <b>${euro(tc)}</b> ce mois-ci contre <b>${euro(tp)}</b> sur la même période en ${pn}`);
  if (tp > 0) { const d = (tc / tp - 1) * 100; h = h.replace(/<\/p>$/, '') + ` (<b class="${d <= 0 ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${Math.round(d)} %</b>).</p>`; } else h = h.replace(/<\/p>$/, '.</p>');
  const gc = Object.fromEntries(groupByCat(cur).map(g => [g.cat.id, g]));
  const gp = Object.fromEntries(groupByCat(prev).map(g => [g.cat.id, g]));
  const ids = [...new Set([...Object.keys(gc), ...Object.keys(gp)])];
  const rows = ids.map(id => ({ cat: (gc[id] || gp[id]).cat, a: gc[id] ? gc[id].total : 0, b: gp[id] ? gp[id].total : 0 }))
    .map(r => ({ ...r, d: r.a - r.b })).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 6);
  h += '<div class="a-rows">' + rows.map(r =>
    `<div class="a-row"><div class="a-row-top"><span>${r.cat.icon} ${escapeHtml(r.cat.label)}</span><span>${euro(r.a)} <i>vs ${euro(r.b)}</i> <b class="${r.d <= 0 ? 'pos' : 'neg'}">${r.d > 0 ? '▲' : r.d < 0 ? '▼' : '='} ${euro(Math.abs(r.d))}</b></span></div></div>`).join('') + '</div>';
  const worst = rows.filter(r => r.d > 0)[0];
  if (worst) h += p(`La plus forte hausse vient de ${worst.cat.icon} <b>${escapeHtml(worst.cat.label)}</b> (+${euro(worst.d)}).`);
  return h;
}

function ansTop(period) {
  const r = getRange(period);
  const list = txIn(r.start, r.end, 'expense').sort((a, b) => b.amount - a.amount).slice(0, 5);
  if (!list.length) return emptyMsg(`Aucune dépense enregistrée sur <b>${r.label}</b>.`);
  return p(`Tes ${list.length} plus grosses dépenses sur <b>${r.label}</b> :`) + '<div class="a-rows">' + list.map(t => {
    const c = findCat(t.cat);
    return `<div class="a-row"><div class="a-row-top"><span>${c.icon} ${escapeHtml(t.note || c.label)} <i>${shortDate(t.date)}</i></span><span><b>${euro(t.amount)}</b></span></div></div>`;
  }).join('') + '</div>';
}

function ansWeekly() {
  const now = new Date();
  const mon = new Date(now); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const s = new Date(mon); s.setDate(s.getDate() - i * 7);
    const e = new Date(s); e.setDate(e.getDate() + 6);
    weeks.push({ s, total: sumTx(txIn(fmtKey(s), fmtKey(e), 'expense')) });
  }
  const max = Math.max(...weeks.map(w => w.total), 1);
  const avg = weeks.reduce((s, w) => s + w.total, 0) / weeks.length;
  if (weeks.every(w => w.total === 0)) return emptyMsg('Aucune dépense sur les 8 dernières semaines.');
  const chart = '<div class="a-chart">' + weeks.map((w, i) =>
    `<div class="a-col"><span class="a-val">${w.total ? Math.round(w.total) : ''}</span><div class="a-colbar ${i === weeks.length - 1 ? 'cur' : ''}" style="height:${Math.max(3, w.total / max * 100)}px"></div><span class="a-lab">${w.s.getDate()}/${w.s.getMonth() + 1}</span></div>`).join('') + '</div>';
  const best = weeks.reduce((a, b) => (b.total > a.total ? b : a));
  return p('Dépenses par semaine (semaines commençant le lundi), en €.') + chart +
    p(`Moyenne : <b>${euro(avg)}</b> par semaine. Semaine la plus chargée : celle du ${shortDate(fmtKey(best.s))} (<b>${euro(best.total)}</b>).`);
}

function ansCalendar() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const list = [];
  state.scheduled.forEach(it => occurrencesInMonth(it, y, m).forEach(date => list.push({ p: it, date })));
  list.sort((a, b) => a.date.localeCompare(b.date));
  if (!list.length) return emptyMsg(`Aucune échéance prévue en <b>${monthName(y, m)}</b>.`);
  const by = {}; list.forEach(o => (by[o.date] = by[o.date] || []).push(o));
  const pad = n => String(n).padStart(2, '0');
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  let g = '<div class="cal-grid a-cal">' + ['L','M','M','J','V','S','D'].map(l => `<div class="cal-dow">${l}</div>`).join('');
  for (let i = 0; i < offset; i++) g += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m + 1)}-${pad(d)}`; const ops = by[k] || [];
    g += `<div class="cal-day${ops.length ? ' has' : ''}${k === todayKey() ? ' today' : ''}"><span class="n">${d}</span>${ops.length ? `<span class="cal-dots">${ops.slice(0, 3).map(o => `<i class="${o.p.type === 'income' ? 'i' : 'e'}"></i>`).join('')}</span>` : ''}</div>`;
  }
  g += '</div>';

function ansCategory(cat, period) {

  const total = sumTx(list);

  let h = p(`${cat.icon} <b>${escapeHtml(cat.label)}</b> sur <b>${r.label}</b> : <b>${euro(total)}</b> en ${list.length} opération${list.length > 1 ? 's' : ''} (moyenne ${euro(total / list.length)}).`);
  const prev = sumTx(txIn(r.prevStart, r.prevEnd).filter(t => t.cat === cat.id));
  if (prev > 0) { const d = (total / prev - 1) * 100; h += p(`Sur ${r.prevLabel} : ${euro(prev)} (<b class="${(isInc ? d >= 0 : d <= 0) ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${Math.round(d)} %</b>).`); }
  h += '<div class="a-rows">' + list.sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts).slice(0, 5).map(t =>

  return h;
}

// ---------- Recurrence / projection helpers ----------
function advanceDate(key, recurrence, interval, day) {
  const d = parseKey(key);
  const n = interval || 1;
  if (recurrence === 'daily') d.setDate(d.getDate() + n);
  else if (recurrence === 'weekly') d.setDate(d.getDate() + 7 * n);
  else if (recurrence === 'monthly') {
    const dd = day || d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    t.setDate(Math.min(dd, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
    return fmtKey(t);
  } else if (recurrence === 'yearly') {
    const dd = day || d.getDate();
    const t = new Date(d.getFullYear() + n, d.getMonth(), 1);
    t.setDate(Math.min(dd, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
    return fmtKey(t);
  }
  return fmtKey(d);
}
function occurrencesInWindow(item, horizonKey) {
  const tKey = todayKey();
  let cursorKey = item.nextDate < tKey ? tKey : item.nextDate;
  const results = [];
  if (item.recurrence === 'once') {
    if (cursorKey <= horizonKey) results.push(cursorKey);
    return results;
  }
  let guard = 0;
  while (cursorKey <= horizonKey && guard < 500) {
    results.push(cursorKey);
    cursorKey = advanceDate(cursorKey, item.recurrence, item.interval, item.day);
    guard++;
  }
  return results;
}
function occurrencesInMonth(item, year, month) {
  const monthStartKey = fmtKey(new Date(year, month, 1));
  const monthEndKey = fmtKey(new Date(year, month + 1, 0));
  const results = [];
  if (item.recurrence === 'once') {
    if (item.nextDate >= monthStartKey && item.nextDate <= monthEndKey) results.push(item.nextDate);
    return results;
  }
  let cursorKey = item.nextDate;
  let guard = 0;
  while (cursorKey <= monthEndKey && guard < 60) {
    if (cursorKey >= monthStartKey) results.push(cursorKey);
    cursorKey = advanceDate(cursorKey, item.recurrence, item.interval, item.day);
    guard++;
  }
  return results;
}
function computeProjection() {
  const now = new Date();
  const horizon = new Date(now.getFullYear(), now.getMonth() + 1, 0); // last day of current month
  const horizonKey = fmtKey(horizon);
  let total = 0;
  state.scheduled.forEach(item => {
    const occ = occurrencesInWindow(item, horizonKey);
    const amt = item.type === 'income' ? item.amount : -item.amount;
    total += amt * occ.length;
  });
  return state.balanceStart + total;
}

function eurS(n) { const v = Math.round(n * 100) / 100; return (Object.is(v, -0) ? 0 : v).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' €'; }
function eurR(n) { return Math.round(n).toLocaleString('fr-FR') + ' €'; }
function amtShort(n) {
  const a = Math.abs(n);
  const s = (a >= 1000 ? Math.round(a) : Math.round(a * 100) / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  return (n < 0 ? '-' : n > 0 ? '+' : '') + s + ' €';
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function monthItems(y, m) {

function renderBudgetSub() {
  const root = document.getElementById('sub-budget');
  const y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
  const items = monthItems(y, m);
  const isCur = y === new Date().getFullYear() && m === new Date().getMonth();
  const mode = state.budgetMode;

  // --- aggregates ---
  const expReal = {}, expPlan = {};
  items.filter(i => i.type !== 'income').forEach(i => { const t = i.kind === 'tx' ? expReal : expPlan; t[grpOf(i.cat)] = (t[grpOf(i.cat)] || 0) + i.amount; });
  const expCats = GROUPS.filter(c => state.budgets[c.id] && c.id !== 'epargne');
  // planned amount per expense category: user budget if set, otherwise what is already spent/scheduled
  const planned = c => state.budgets[c.id] || 0;
  const totalPlannedExp = expCats.reduce((s, c) => s + planned(c), 0);
  const incItems = items.filter(i => i.type === 'income');
  const totalInc = incItems.reduce((s, i) => s + i.amount, 0);
  const savBudget = state.budgets.epargne || 0;
  const saving = savBudget > 0 ? savBudget : totalInc - totalPlannedExp;
  const freeAmt = savBudget > 0 ? totalInc - totalPlannedExp - savBudget : 0;
  const realExp = Object.values(expReal).reduce((s, v) => s + v, 0);
  const upExp = Object.values(expPlan).reduce((s, v) => s + v, 0);
  const upInc = incItems.filter(i => i.kind === 'sched').reduce((s, i) => s + i.amount, 0);
  const remaining = isCur ? computeProjection() : (totalInc - realExp - upExp);

  // --- donut segments ---
  let segs = [], centerBig, centerSmall;
  if (mode === 'plan') {
    const total = totalPlannedExp + Math.max(saving, 0) + Math.max(freeAmt, 0);
    expCats.slice().sort((a, b) => planned(b) - planned(a)).forEach(c => segs.push({ id: c.id, color: c.color, icon: c.icon, label: c.label, v: planned(c) }));
    if (saving > 0) segs.push({ id: savBudget > 0 ? 'epargne' : '__sav', color: '#386b4c', icon: ci('piggy-bank'), label: 'Épargne', v: saving });
    if (freeAmt > 0) segs.push({ id: '__free', color: '#d9d1c0', v: freeAmt });
    segs.forEach(s => s.f = total ? s.v / total : 0);
    if (totalInc > 0) { centerBig = `${Math.round(Math.max(saving, 0) / totalInc * 100)}<small>%</small>`; centerSmall = "d'épargne"; }
    else { centerBig = eurR(totalPlannedExp); centerSmall = 'dépenses prévues'; }
  } else {
    const rest = Math.max(remaining, 0);
    const total = realExp + upExp + rest;
    GROUPS.filter(g => expReal[g.id]).sort((a, b) => expReal[b.id] - expReal[a.id]).forEach(g => segs.push({ id: g.id, color: g.color, icon: g.icon, label: g.label, v: expReal[g.id] }));
    GROUPS.filter(g => expPlan[g.id]).sort((a, b) => expPlan[b.id] - expPlan[a.id]).forEach(g => segs.push({ id: '__up_' + g.id, color: 'url(#h_' + g.id + ')', hc: g.color, v: expPlan[g.id] }));
    if (rest) segs.push({ id: '__rest', color: '#d9d1c0', v: rest });
    segs.forEach(s => s.f = total ? s.v / total : 0);
    centerBig = eurR(remaining); centerSmall = 'Restant';
  }

  const patDefs = segs.filter(x => x.hc).map(x => `<pattern id="h_${x.id.slice(5)}" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)"><rect width="14" height="14" fill="${x.hc}" fill-opacity="0.3"/><rect width="7" height="14" fill="${x.hc}" fill-opacity="0.85"/></pattern>`).join('');
  const R = 100, SW = 38, C = 2 * Math.PI * R;
  let off = 0, arcs = '', icons = '';
  segs.forEach(s => {
    const len = Math.max(0, s.f * C - (segs.length > 1 ? 3 : 0));
    arcs += `<circle cx="150" cy="150" r="${R}" fill="none" stroke="${s.color}"${s.op ? ` stroke-opacity="${s.op}"` : ''} stroke-width="${SW}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off * C).toFixed(2)}" transform="rotate(-90 150 150)"/>`;
    if (s.f >= 0.04 && s.icon) {
      const th = (off + s.f / 2) * 2 * Math.PI - Math.PI / 2;
      const px = (150 + 124 * Math.cos(th)) / 3, py = (150 + 124 * Math.sin(th)) / 3;
      icons += `<button type="button" class="bd-ic" data-seg="${s.id}" style="left:${px.toFixed(2)}%;top:${py.toFixed(2)}%;background:${s.color}">${s.icon}</button>`;
    }
    off += s.f;
  });
  if (!segs.length) arcs = `<circle cx="150" cy="150" r="${R}" fill="none" stroke="#ece6da" stroke-width="${SW}"/>`;

  // --- tiles + bar ---
  let tiles, bar;
  if (mode === 'plan') {
    const pe = totalInc ? Math.round(totalPlannedExp / totalInc * 100) : null;
    tiles = `<button type="button" class="bd-tile" data-detail="exp"><div class="tl">Dépenses${pe !== null ? ` (${pe} %)` : ''}</div><div class="tv red">${eurR(totalPlannedExp)}</div></button>
      <button type="button" class="bd-tile" data-detail="sav"><div class="tl">Épargne${totalInc ? ` (${Math.round(Math.max(saving, 0) / totalInc * 100)} %)` : ''}</div><div class="tv ${saving >= 0 ? 'ok' : 'red'}">${eurR(saving)}</div></button>`;
    const w1 = totalInc ? Math.min(100, totalPlannedExp / totalInc * 100) : 0;
    bar = `<div class="bd-bar"><div style="width:${w1}%;background:#c0504d"></div><div style="flex:1;background:#386b4c"></div></div>`;
  } else {
    tiles = `<div class="bd-tile"><div class="tl">Dépenses</div><div class="tv red">${eurR(realExp)}</div></div>
      <div class="bd-tile"><div class="tl">À venir</div><div class="tv red">${eurR(upExp)}</div></div>
      <div class="bd-tile"><div class="tl">Restant</div><div class="tv ${remaining < 0 ? 'red' : 'sand'}">${eurR(remaining)}</div></div>`;
    const tot = realExp + upExp + Math.max(remaining, 0);
    bar = `<div class="bd-bar"><div style="width:${tot ? realExp / tot * 100 : 0}%;background:#c0504d"></div><div class="hatchbg" style="width:${tot ? upExp / tot * 100 : 0}%"></div><div style="flex:1;background:#d9d1c0"></div></div>`;
  }

  // --- detail panel ---
  let detail = '';
  const d = state.budgetDetail;
  if (mode === 'plan' && d === 'exp') {
    detail = `<div class="bd-detail"><div class="dh"><span>Dépenses</span><b class="neg">${eurR(totalPlannedExp)}</b></div>
      ${totalInc ? `<div class="kc-bar"><div style="width:${Math.min(100, totalPlannedExp / totalInc * 100)}%;background:#c0504d"></div></div><div class="goal-sub">${Math.round(totalPlannedExp / totalInc * 100)} % du revenu prévu</div>` : ''}
      ${expCats.slice().sort((a, b) => planned(b) - planned(a)).map(c => `<div class="dl"><span class="kc-ico sm" style="background:${c.color}">${c.icon}</span><span class="dn">${escapeHtml(c.label)}</span><b>${eurS(planned(c))}</b></div>`).join('')}</div>`;
  } else if (mode === 'plan' && d === 'sav') {
    const bySrc = {};
    incItems.forEach(i => bySrc[i.label] = (bySrc[i.label] || 0) + i.amount);
    detail = `<div class="bd-detail"><div class="dh"><span>Épargne</span><b class="pos">${eurR(saving)}</b></div>
      <div class="dl"><span class="dn"><b>Revenu</b></span><b class="pos">+${eurS(totalInc)}</b></div>
      ${Object.entries(bySrc).map(([n, v]) => `<div class="dl sub"><span class="dn">${escapeHtml(n)}</span><span class="pos">${eurS(v)}</span></div>`).join('')}
      <div class="dl"><span class="dn"><b>Dépenses</b></span><b class="neg">-${eurS(totalPlannedExp)}</b></div>
      <div class="dl total"><span class="dn"><b>Restant</b></span><b class="${saving >= 0 ? 'pos' : 'neg'}">${eurS(saving)}</b></div>
      ${totalInc ? `<div class="kc-bar"><div style="width:${Math.max(0, Math.min(100, saving / totalInc * 100))}%;background:#386b4c"></div></div><div class="goal-sub">${Math.round(Math.max(saving, 0) / totalInc * 100)} % du revenu prévu</div>` : ''}</div>`;
  } else if (mode === 'plan' && d && segs.find(s => s.id === d)) {
    const s = segs.find(s => s.id === d);
    detail = `<div class="bd-detail"><div class="dh"><span>${s.icon} ${escapeHtml(s.label)}</span><b>${eurS(s.v)}</b></div>${totalInc ? `<div class="goal-sub">${Math.round(s.v / totalInc * 100)} % du revenu prévu</div>` : ''}</div>`;
  }

  root.innerHTML = `
    <div class="kc-card">
      <div class="bd-switch"><button data-mode="plan" class="${mode === 'plan' ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Prévu</button><button data-mode="real" class="${mode === 'real' ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Réel</button></div>
      <div class="bd-donut">
        <svg viewBox="0 0 300 300"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)"><rect width="14" height="14" fill="#ecc9c6"/><rect width="7" height="14" fill="#d9a4a0"/></pattern>${patDefs}</defs>${arcs}</svg>
        <div class="bd-center"><div class="big ${mode === 'real' && remaining < 0 ? 'neg' : ''}">${centerBig}</div><div class="sm">${centerSmall}</div></div>
        ${icons}
      </div>
      <div class="bd-tiles">${tiles}</div>
      ${bar}
      ${detail}
    </div>
    <div id="bdSections"></div>`;

  root.querySelectorAll('.bd-switch button').forEach(b => b.onclick = () => { state.budgetMode = b.dataset.mode; state.budgetDetail = null; renderBudgetSub(); });
  root.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => { state.budgetDetail = state.budgetDetail === b.dataset.detail ? null : b.dataset.detail; renderBudgetSub(); });
  root.querySelectorAll('.bd-ic').forEach(b => b.onclick = () => { if (GROUPS.find(c => c.id === b.dataset.seg)) openCatView(b.dataset.seg); else { state.budgetDetail = state.budgetDetail === b.dataset.seg ? null : b.dataset.seg; renderBudgetSub(); } });

  // --- sections: Revenus + Dépenses ---
  const sec = document.getElementById('bdSections');
  const groupRows = (list) => {
    const g = {};
    list.forEach(i => {
      const k = i.cat.id + '|' + i.label;
      const o = g[k] = g[k] || { cat: i.cat, label: i.label, exp: 0, got: 0, next: null, rec: null };
      o.exp += i.amount;
      if (i.kind === 'tx') o.got += i.amount; else { if (!o.next || i.date < o.next) o.next = i.date; o.rec = i.p.recurrence; o.p = i.p; }
    });
    return Object.values(g).sort((a, b) => b.exp - a.exp);
  };
  const recText = o => o.rec ? freqText({ recurrence: o.rec, interval: o.p.interval, day: o.p.day, nextDate: o.next }) : 'Enregistré';
  const incRows = groupRows(incItems);
  if (incRows.length) {
    sec.insertAdjacentHTML('beforeend', `<div class="bd-sec"><span>Revenus</span><b>${eurR(mode === 'plan' ? totalInc : incRows.reduce((s, o) => s + o.got, 0))}</b></div>`);
    const card = document.createElement('div'); card.className = 'kc-card bd-list';
    incRows.forEach(o => {
      const pct = o.exp ? Math.min(100, o.got / o.exp * 100) : 0;
      card.insertAdjacentHTML('beforeend', mode === 'plan'
        ? `<div class="bd-row"><div class="kc-ico" style="background:${o.cat.color}">${o.cat.icon}</div><div class="bi"><div class="bn">${escapeHtml(o.label)}</div><div class="bs">${recText(o)}</div></div><div class="ba pos">${eurS(o.exp)}</div></div>`
        : `<div class="bd-row"><div class="kc-ico" style="background:${o.cat.color}">${o.cat.icon}</div><div class="bi"><div class="bn">${escapeHtml(o.label)}</div><div class="kc-bar"><div style="width:${pct}%;background:#4a9a6a"></div></div><div class="bs">${o.next ? 'Attendu le ' + shortDate(o.next) : 'Reçu'}</div></div><div class="ba">${eurS(o.got)}<small>/ ${eurS(o.exp)}</small></div></div>`);
    });
    sec.appendChild(card);
  }
  sec.insertAdjacentHTML('beforeend', `<div class="bd-sec"><span>Dépenses</span><b>${eurR(mode === 'plan' ? totalPlannedExp : realExp)}</b></div>`);
  const dcard = document.createElement('div'); dcard.className = 'kc-card bd-list';
  const allCats = GROUPS.slice().sort((a, b) => planned(b) - planned(a));
  allCats.forEach(c => {
    const real = expReal[c.id] || 0, plan = expPlan[c.id] || 0, p = planned(c), b = state.budgets[c.id] || 0;
    const row = document.createElement('div');
    row.className = 'bd-row clickable';
    const ratio = p ? (real + plan) / p : 0;
    const col = !b ? '#4a9a6a' : (real + plan) > b ? '#c0453f' : ratio > 0.8 ? '#e0a23a' : '#4a9a6a';
    row.innerHTML = mode === 'plan'
      ? `<div class="kc-ico" style="background:${c.color}">${c.icon}</div><div class="bi"><div class="bn">${escapeHtml(c.label)}</div><div class="bs">${b ? 'Budget fixé' : 'Touche pour fixer un budget'}</div></div><div class="ba neg">${p ? '-' + eurS(p) : '—'}</div>`
      : `<div class="kc-ico" style="background:${c.color}">${c.icon}</div><div class="bi"><div class="bn">${escapeHtml(c.label)}</div>${p ? `<div class="kc-bar"><div style="width:${Math.min(100, ratio * 100)}%;background:${col}"></div></div>` : ''}<div class="bs">${plan ? eurS(plan) + ' à venir' : (p ? '' : 'Pas de budget')}</div></div><div class="ba">${eurS(real)}${p ? `<small>/ ${eurS(p)}</small>` : ''}</div>`;
    row.onclick = () => openCatView(c.id);
    dcard.appendChild(row);
  });
  sec.appendChild(dcard);
  const addG = document.createElement('div');
  addG.innerHTML = '<button type="button" class="cv-add" id="grpAdd" style="background:#fff;border-radius:22px;margin-top:12px;box-shadow:0 2px 10px rgba(120,100,60,0.08)">+ Nouveau groupe</button><div id="grpForm"></div>';
  sec.appendChild(addG);
  document.getElementById('grpAdd').onclick = () => {
    const f = document.getElementById('grpForm');
    if (f.innerHTML) { f.innerHTML = ''; return; }
    const cols = ['#9a7a10', '#1fab96', '#0057a8', '#8b7cf6', '#2e8b7f', '#c77db3', '#e84a4a', '#c96a4a', '#a863a0', '#3f7fa8', '#4f7bbf', '#a0522d'];
    const icos = ['tag', 'house', 'car', 'heart', 'gift', 'plane', 'shopping-bag', 'gamepad-2', 'graduation-cap', 'paw-print', 'briefcase', 'coins'];
    let col = cols[0], ico = icos[0];
    f.innerHTML = `<div class="cv-card" style="margin-top:12px">
      <div class="cv-lb">NOM DU GROUPE</div>
      <div class="cv-bedit" style="margin-top:6px"><input id="grpName" maxlength="24" placeholder="ex. Sport, Animaux…"></div>
      <div class="cv-lb">COULEUR</div><div class="grp-pick" id="grpCols">${cols.map(c => `<button type="button" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
      <div class="cv-lb" style="margin-top:12px">ICÔNE</div><div class="grp-pick" id="grpIcos">${icos.map(n => `<button type="button" data-i="${n}">${ci(n)}</button>`).join('')}</div>
      <button type="button" class="cv-add" id="grpOk" style="background:#8e6d3a;color:#fff;border-radius:14px;margin-top:14px;padding:12px">Créer le groupe</button></div>`;
    const mark = () => {
      f.querySelectorAll('#grpCols button').forEach(b => b.classList.toggle('on', b.dataset.c === col));
      f.querySelectorAll('#grpIcos button').forEach(b => { b.classList.toggle('on', b.dataset.i === ico); b.style.background = b.dataset.i === ico ? col : ''; });
    };
    f.querySelectorAll('#grpCols button').forEach(b => b.onclick = () => { col = b.dataset.c; mark(); });
    f.querySelectorAll('#grpIcos button').forEach(b => b.onclick = () => { ico = b.dataset.i; mark(); });
    mark(); document.getElementById('grpName').focus();
    document.getElementById('grpOk').onclick = async () => {
      const name = document.getElementById('grpName').value.trim();
      if (!name) { showToast('Indiquez un nom'); return; }
      const id = 'g_' + Date.now().toString(36);
      const g = { id, label: name, ico, color: col, icon: ci(ico) };
      GROUPS.splice(GROUPS.length - 1, 0, g);
      state.groups.push({ id, label: name, ico, color: col });
      localStorage.setItem('fin_groups', JSON.stringify(state.groups));
      state.expenseCats.splice(Math.max(0, state.expenseCats.findIndex(c => c.id === 'divers')), 0, { id: 'c_' + id, label: name, ico, icon: ci(ico), color: col, grp: id });
      await saveExpenseCats();
      showToast('Groupe créé');
      renderBudgetSub();
    };
  };
}


// ---------- DÉTAIL D'UN GROUPE (budget) ----------
function openCatView(id) { state.catView = id; document.getElementById('catView').classList.add('open'); renderCatView(); }
function closeCatView() { state.catView = null; document.getElementById('catView').classList.remove('open'); }
function renderCatView() {
  const id = state.catView; if (!id) return;
  const c = GROUPS.find(x => x.id === id);
  if (!c) { closeCatView(); return; }
  const y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
  const items = monthItems(y, m);
  const mine = items.filter(i => i.type !== 'income' && grpOf(i.cat) === id);
  const real = mine.filter(i => i.kind === 'tx').reduce((a, i) => a + i.amount, 0);
  const plan = mine.filter(i => i.kind === 'sched').reduce((a, i) => a + i.amount, 0);
  const b = state.budgets[id] || 0;
  const planned = b;
  const totalInc = items.filter(i => i.type === 'income').reduce((a, i) => a + i.amount, 0);
  // groupes (comme la liste du budget)
  const g = {};
  mine.forEach(i => {
    const k = i.label;
    const o = g[k] = g[k] || { label: i.label, exp: 0, got: 0, date: i.date, p: null, icon: i.cat.icon };
    o.exp += i.amount;
    if (i.kind === 'tx') o.got += i.amount; else { o.p = i.p; if (i.date < o.date || !o.got) o.date = i.date; }
  });
  const rows = Object.values(g).sort((a, b2) => b2.exp - a.exp);
  const base = b || Math.max(real + plan, 1);
  const mtxt = state.viewMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const usedCats = new Set(mine.map(i => i.cat.id));
  const sugg = state.expenseCats.filter(k => grpOf(k) === id && !usedCats.has(k.id));
  document.getElementById('cvBody').innerHTML = `
    <div class="cv-head">
      <button class="cv-back" id="cvBack" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="cv-ico" style="background:${c.color}">${c.icon}</div>
      <div class="cv-tt"><b>${escapeHtml(c.label)}</b><span>${mtxt.charAt(0).toUpperCase() + mtxt.slice(1)}</span></div>
      <button class="cv-btn del" id="cvDel" aria-label="Retirer le budget">🗑</button>
    </div>
    <div class="cv-card">
      <div class="cv-lb">BUDGET</div>
      <div class="cv-amt"><span>${b ? eurS(b) : '—'}</span><button id="cvEdit" aria-label="Modifier">✎</button></div>
      <div id="cvEditBox"></div>
      ${b ? `<div class="cv-bar"><i style="width:${Math.min(100, (real + plan) / b * 100)}%;background:${(real + plan) > b ? '#c0453f' : c.color}"></i></div>` : ''}
      <div class="cv-sub">${b ? (totalInc ? Math.round(b / totalInc * 100) + ' % de tes revenus du mois' : 'Objectif de base du mois') : 'Fixe un montant de base pour ce groupe.'}</div>
      <div class="cv-sub">Réel : ${eurS(real)} dépensés${plan ? ' · ' + eurS(plan) + ' à venir' : ''}</div>
    </div>
    <div class="cv-h2">Dépenses du mois</div>
    <div class="cv-list">
      ${rows.map((o, i) => `<div class="cv-it"><div class="cv-ico" style="background:${c.color}">${o.icon || c.icon}</div><div class="bi"><div class="bn">${escapeHtml(o.label)}</div><div class="bs">le ${parseKey(o.date).getDate()}${o.got ? ' · réalisé' : ''}</div><div class="cv-bar"><i style="width:${Math.min(100, o.exp / base * 100)}%;background:${c.color}"></i></div></div><div class="ba">${eurS(o.exp)}</div>${o.p ? `<button class="x" data-del="${o.p.id}" aria-label="Supprimer">✕</button>` : '<span style="width:26px"></span>'}</div>`).join('')}
      <button class="cv-add" id="cvAdd">+ Ajouter une dépense régulière</button>
    </div>
    ${sugg.length ? `<div class="cv-h2">Suggestions</div><div class="cv-chips">${sugg.map((k, i) => `<button class="cv-chip" data-s="${i}"><span style="color:#b9ae9a">+</span><i style="background:${k.color}">${k.icon}</i>${escapeHtml(k.label)}</button>`).join('')}</div>` : ''}`;
  const q = sel => document.getElementById('cvBody').querySelector(sel);
  q('#cvBack').onclick = closeCatView;
  q('#cvDel').onclick = async () => { if (state.budgets[id]) { delete state.budgets[id]; await saveBudgets(); showToast('Budget retiré'); renderActive(); renderCatView(); } else showToast('Aucun budget défini'); };
  q('#cvEdit').onclick = () => {
    const box = q('#cvEditBox');
    if (box.innerHTML) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="cv-bedit"><input inputmode="decimal" placeholder="Budget mensuel en €" value="${b ? String(b).replace('.', ',') : ''}"><button type="button">OK</button></div>`;
    const inp = box.querySelector('input'); inp.focus();
    box.querySelector('button').onclick = async () => {
      const v = parseFloat(String(inp.value).replace(',', '.'));
      if (!(v > 0)) delete state.budgets[id]; else state.budgets[id] = v;
      await saveBudgets(); renderActive(); renderCatView();
    };
  };
  const addReg = k => { openWizard('expense'); if (k) { state.wiz.cat = k.id; state.wiz.name = k.label; } renderWizard(); };
  q('#cvAdd').onclick = () => addReg(null);
  document.getElementById('cvBody').querySelectorAll('.cv-chip').forEach(bt => bt.onclick = () => addReg(sugg[+bt.dataset.s]));
  document.getElementById('cvBody').querySelectorAll('[data-del]').forEach(bt => bt.onclick = async () => {
    state.scheduled = state.scheduled.filter(x => x.id !== bt.dataset.del);
    await saveScheduled(); renderActive(); renderCatView(); showToast('Supprimé');
  });
}

function tweenNum(el, from, to, fmt) {
  if (el._tw) cancelAnimationFrame(el._tw);
  const t0 = performance.now(), dur = 260;
  const st = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) el._tw = requestAnimationFrame(st); };
  el._tw = requestAnimationFrame(st);
}
function renderForecastSub() {
  const root = document.getElementById('sub-forecast');
  const y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
  const monthEnd = new Date(y, m + 1, 0), N = monthEnd.getDate();
  const horizon = fmtKey(monthEnd), tk = todayKey();
  if (horizon < tk) {
    root.innerHTML = '<div class="kc-card"><div class="empty-state">Ce mois est passé : la prévision porte sur le mois en cours et les suivants.</div></div>';
    return;
  }
  const accs = accList();
  if (!accs.find(a => a.id === state.fcAcc)) state.fcAcc = 'main';
  const acc = accs.find(a => a.id === state.fcAcc);
  const A = id => (id || 'main');
  const nowBal = acc.amount;
  const events = upcomingUntil(horizon).filter(e => A(e.p.acc) === acc.id);
  const evBy = {}; events.forEach(e => (evBy[e.date] = evBy[e.date] || []).push(e));
  const txs = state.transactions.filter(t => A(t.acc) === acc.id && !t.noBal);
  const txBy = {}; txs.forEach(t => (txBy[t.date] = txBy[t.date] || []).push(t));
  const sg = (type, a) => type === 'income' ? a : -a;
  // solde projeté jour par jour (aujourd'hui → fin de mois)
  const balAt = {}; let bal = nowBal;
  for (let d = parseKey(tk), n = 0; d <= monthEnd && n < 400; d.setDate(d.getDate() + 1), n++) {
    const k = fmtKey(d);
    (evBy[k] || []).forEach(e => { bal += sg(e.p.type, e.p.amount); });
    balAt[k] = bal;
  }
  const pastBal = k => nowBal - txs.filter(t => t.date > k && t.date <= tk).reduce((a, t) => a + sg(t.type, t.amount), 0);
  const balOn = k => k >= tk ? balAt[k] : pastBal(k);
  const endBal = balAt[horizon];
  // jours du mois affichés
  const days = [];

    if (k >= tk) (evBy[k] || []).forEach(e => { const c = findCat(e.p.cat); rows.push({ c, label: e.p.label || c.label, amt: e.p.amount, inc: e.p.type === 'income' }); });
    const mx = Math.max(1, ...rows.map(r => r.amt));
    const head = parseKey(k).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
    return `<div class="fc2-day"><div class="fc2-dh">${head}</div>
      ${rows.length ? `<div class="fc2-rows">${rows.map(r => `<div class="fc2-r"><span class="ci" style="background:${r.c.color}">${r.c.icon}</span><span class="nm">${escapeHtml(r.label)}</span>${rows.length > 1 ? `<span class="tr"><i style="width:${Math.max(6, r.amt / mx * 100)}%;background:${r.inc ? '#2f6a4a' : '#9b2a22'}"></i></span>` : ''}<span class="am ${r.inc ? 'inc' : 'exp'}">${eurS(r.amt)}</span></div>`).join('')}</div>` : ''}</div>`;

  const zY = FY(0);

  const fDots = days.map((x, i) => {

  }).join('');
  const fArea = `${fPath} L${FX(N - 1).toFixed(1)},${zY.toFixed(1)} L${FX(0).toFixed(1)},${zY.toFixed(1)} Z`;
  const fcSvg = `<defs><clipPath id="fcClipU"><rect x="0" y="0" width="${FW}" height="${zY.toFixed(1)}"/></clipPath><clipPath id="fcClipD"><rect x="0" y="${zY.toFixed(1)}" width="${FW}" height="${(CH - zY).toFixed(1)}"/></clipPath></defs>
    <path d="${fArea}" fill="#3d9a68" fill-opacity=".16" clip-path="url(#fcClipU)"/><path d="${fArea}" fill="#d0463f" fill-opacity=".18" clip-path="url(#fcClipD)"/>
    <line x1="0" x2="${FW}" y1="${zY.toFixed(1)}" y2="${zY.toFixed(1)}" stroke="#cfc6b6" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${fPath}" fill="none" stroke="#2f9a5c" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke" clip-path="url(#fcClipU)"/>

  root.innerHTML = `

    if (state.fcSel !== days[i].k) apply(days[i].k);
  };
  let down = false;
  chart.onpointerdown = ev => { down = true; pick(ev); };
  chart.onpointermove = ev => { if (down) pick(ev); };
  const upf = () => { down = false; };
  chart.onpointerup = upf; chart.onpointercancel = upf; chart.onpointerleave = upf;

}
function countTo(el, from, to) {
  if (actCount) cancelAnimationFrame(actCount);
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = fmtTot(from + (to - from) * e);
    if (k < 1) actCount = requestAnimationFrame(step); else { el.innerHTML = fmtTot(to); actCount = null; }
  };
  actCount = requestAnimationFrame(step);
}

function renderActTx(shownTx, all) {
  const el = document.getElementById('actTx');
  if (!el) return;
  if (!shownTx) {
    const q = norm(state.actQuery || '');
    let txs = state.transactions.slice();

  const oldest = (all && all.length > shownTx.length && shownTx.length) ? shownTx[shownTx.length - 1].date : '';
  const trs = state.actType !== 'all' ? [] : state.transfers.filter(t => t.date >= oldest && (!q2 || norm(accName(t.from) + ' ' + accName(t.to)).includes(q2) || String(t.amount).replace('.', ',').includes(q2)));
  if (!shownTx.length && !trs.length) { el.insertAdjacentHTML('beforeend', `<div class="empty-state">${state.transactions.length ? 'Aucun résultat.' : 'Aucune transaction pour l\'instant.<br>Utilise « Dépense » ou « Revenu » ci-dessus.'}</div>`); return; }
  const byDay = {};
  shownTx.forEach(t => (byDay[t.date] = byDay[t.date] || []).push(t));
  trs.forEach(t => (byDay[t.date] = byDay[t.date] || []).push({ _tr: t }));
  Object.keys(byDay).sort((a, b) => b.localeCompare(a)).forEach(k => {
    const list = byDay[k];
    const net = list.reduce((s, t) => s + (t._tr ? 0 : signedAmount(t)), 0);
    el.insertAdjacentHTML('beforeend', `<div class="act-day">${fmtDayLabel(parseKey(k))}${list.some(t => !t._tr) ? `<span class="dot-sep">·</span><span class="act-chip ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : '-'}${eurS(Math.abs(net))}</span>` : ''}</div>`);
    list.forEach(t => {
      if (t._tr) {
        const x = t._tr, row = document.createElement('div');
        row.className = 'kc-row';
        row.innerHTML = `<div class="kc-row-main"><div class="kc-ico" style="background:#8a8f99">🔁</div><div class="kc-info"><div class="kc-label">${escapeHtml(accName(x.from))} → ${escapeHtml(accName(x.to))}</div><div class="kc-sub">Transfert · appuyer pour supprimer</div></div><div class="kc-amt">${eurS(x.amount)}</div></div>`;
        let armed = false;
        row.onclick = () => { if (!armed) { armed = true; row.querySelector('.kc-sub').textContent = 'Appuyer encore pour confirmer la suppression'; setTimeout(() => { armed = false; const sb = row.querySelector('.kc-sub'); if (sb) sb.textContent = 'Transfert · appuyer pour supprimer'; }, 3000); } else deleteTransfer(x.id); };
        el.appendChild(row); return;
      }
      const c = findCat(t.cat);
      el.appendChild(buildRow({ kind: 'tx', id: t.id, type: t.type, amount: t.amount, cat: c, label: t.note || c.label, date: t.date, ts: t.ts, chipText: c.label }));
    });
  });
  setTimeout(actReveal, 0);
  if (all.length > shownTx.length) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'act-more'; b.textContent = 'Voir plus';
    b.onclick = () => { state.actLimit += 60; renderActivity(); };
    el.appendChild(b);
  }
}

function ddIsOpen(key, def) {
  if (def === undefined) def = true;
  try {
    const v = JSON.parse(localStorage.getItem('fin_dd_state') || '{}')[key];
    return v === undefined ? def : v;
  } catch (e) { return def; }
}
function ddSetOpen(key, open) {
  try {
    const s = JSON.parse(localStorage.getItem('fin_dd_state') || '{}');
    s[key] = open;
    localStorage.setItem('fin_dd_state', JSON.stringify(s));
  } catch (e) {}
}
function applyDropdown(ddEl, open) {
  ddEl.classList.toggle('collapsed', !open);
  ddEl.firstElementChild.setAttribute('aria-expanded', String(open));
}
function bindDropdown(ddEl, key, def) {
  applyDropdown(ddEl, ddIsOpen(key, def));
  ddEl.firstElementChild.onclick = () => {
    const open = ddEl.classList.contains('collapsed');
    applyDropdown(ddEl, open);
    ddSetOpen(key, open);
  };
}

// ---------- PATRIMOINE ----------
const PA_COL = { daily: '#5b8fa3', savings: '#4a9a6a', invest: '#7a72ad', immo: '#a8864f', credit: '#c0675f' };
const PA_SEC = { daily: 'Argent du quotidien', savings: 'Épargne/Livret', invest: 'Investissements', credit: 'Cartes de crédit', immo: 'Immobilier' };
function renderPatrimoine() {
  const root = document.getElementById('paRoot'); if (!root) return;
  const accs = accList(), total = totalWealth(), tk = todayKey();
  const sgn = t => t.type === 'income' ? t.amount : -t.amount;
  const txs = state.transactions.filter(t => !t.noBal && t.date <= tk);
  const net = {}; txs.forEach(t => net[t.date] = (net[t.date] || 0) + sgn(t));
  const wOn = k => total - txs.filter(t => t.date > k).reduce((a, t) => a + sgn(t), 0);
  const earliest = txs.length ? txs.reduce((a, t) => t.date < a ? t.date : a, tk) : tk;
  const addD = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return fmtKey(d); };
  const now = new Date();
  let rs = ({ '1m': addD(tk, -30), ytd: now.getFullYear() + '-01-01', '1y': addD(tk, -365), all: '0000-00-00' })[state.paRange];
  const minStart = addD(earliest, -1);
  const start = rs > minStart ? rs : minStart;
  // série quotidienne (de aujourd'hui vers le passé)
  const pts = []; let cur = total;
  for (let d = parseKey(tk), n = 0; fmtKey(d) >= start && n < 800; d.setDate(d.getDate() - 1), n++) {
    const k = fmtKey(d); pts.push({ k, v: cur }); cur -= (net[k] || 0);
  }
  pts.reverse();
  if (pts.length < 2) pts.unshift({ k: addD(pts[0].k, -1), v: pts[0].v });
  const first = pts[0].v, delta = total - first;
  const fm = v => state.paHide ? '••••' : eurR(v);
  const fd = k => parseKey(k).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
  // chart
  const W = 340, H = 230, P = 6;
  const vs = pts.map(x => x.v), mn = Math.min(...vs), mx = Math.max(...vs), sp = mx - mn || 1;
  const X = i => P + i / (pts.length - 1) * (W - 2 * P), Y = v => P + 14 + (1 - (v - mn) / sp) * (H - 2 * P - 28);
  let dPath = `M${X(0).toFixed(1)},${Y(pts[0].v).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) { const x0 = X(i - 1), y0 = Y(pts[i - 1].v), x1 = X(i), y1 = Y(pts[i].v), cx = (x0 + x1) / 2; dPath += ` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`; }
  const area = `${dPath} L${X(pts.length - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z`;
  const lastI = pts.length - 1;
  // répartition
  const pos = accs.filter(a => a.amount > 0);
  let items;
  if (state.paGroup === 'cat') {
    const by = {}; pos.forEach(a => by[a.type] = (by[a.type] || 0) + a.amount);
    items = Object.entries(by).map(([id, v]) => ({ id, v, label: ACC_TYPES[id].label, col: PA_COL[id], accs: pos.filter(a => a.type === id) }));
  } else items = pos.map(a => ({ id: a.id, v: a.amount, label: a.name, col: PA_COL[a.type], accs: [a] }));
  items.sort((a, b) => b.v - a.v);
  const sumPos = items.reduce((a, b) => a + b.v, 0);
  const cells = []; treemapLayout(items, 0, 0, 100, 100, cells);
  const pop = state.paPop && items.find(x => x.id === state.paPop);
  const tree = items.length ? `<div class="pa-tree">${cells.map(({ it, x, y, w, h }) => `<div class="pa-cell" data-id="${it.id}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><div style="background:${it.col}">${w > 12 && h > 12 ? `<b>${fm(it.v)}</b>` : ''}${w > 22 && h > 22 ? `<small>${escapeHtml(it.label)} · ${Math.round(it.v / sumPos * 100)}%</small>` : ''}</div></div>`).join('')}</div>` : '<div class="empty-state">Ajoute un compte pour voir la répartition.</div>';
  const popHtml = pop ? `<div class="pa-pop"><div class="ph"><span style="color:${pop.col}">${escapeHtml(pop.label)}</span><span>${fm(pop.v)}</span></div>${pop.accs.map(a => `<div class="pr"><span>${escapeHtml(a.name)}</span><b style="color:${pop.col}">${fm(a.amount)}</b></div><div class="pb"><i style="width:${Math.max(4, a.amount / pop.v * 100)}%;background:${pop.col}"></i></div>`).join('')}</div>` : '';
  // sections par type
  const accCard = a => `<div class="acc-card" data-acc="${a.id}" style="background:${a.id === 'main' ? 'linear-gradient(135deg,#8e8b8b,#b9b6b6 60%,#a5a2a2)' : ACC_TYPES[a.type].card}"><div class="acc-n">${escapeHtml(a.name)}</div><div class="acc-v">${a.amount < 0 ? '−' : ''}${Math.trunc(Math.abs(a.amount)).toLocaleString('fr-FR')}<small>,${fmtAmount(Math.abs(a.amount)).split(',')[1]}</small> €</div></div>`;
  const types = ['daily', 'savings', 'invest', 'credit'].concat(accs.some(a => a.type === 'immo') ? ['immo'] : []);
  const secs = types.map(tp => { const list = accs.filter(a => a.type === tp), sum = list.reduce((a, c) => a + c.amount, 0);
    return `<div class="pa-sec">${PA_SEC[tp]}${list.length ? ` <span class="t">${fm(sum)}</span>` : ''}<button type="button" class="plus" data-add="${tp}" aria-label="Ajouter">+</button></div>
      <div class="pa-grid">${list.map(accCard).join('')}${list.length ? '' : `<button type="button" class="acc-add" data-add="${tp}"><span>+</span>Ajouter un compte</button>`}</div>`; }).join('');
  // historique
  const dayKeys = Object.keys(net).sort().reverse();
  const months = {}; dayKeys.forEach(k => (months[k.slice(0, 7)] = months[k.slice(0, 7)] || []).push(k));
  const mKeys = Object.keys(months).sort().reverse();
  if (state.paOpenM === null && mKeys.length) state.paOpenM = mKeys[0];
  const mName = mk => { const [yy, mm] = mk.split('-').map(Number); const t = monthName(yy, mm - 1); return t.charAt(0).toUpperCase() + t.slice(1); };
  const hist = mKeys.map(mk => {
    const [yy, mm] = mk.split('-').map(Number);
    const endK = fmtKey(new Date(yy, mm, 0)) < tk ? fmtKey(new Date(yy, mm, 0)) : tk;
    const prevEnd = fmtKey(new Date(yy, mm - 1, 0));
    const ch = wOn(endK) - wOn(prevEnd), open = state.paOpenM === mk;
    return `<div class="pa-mon"><div class="pa-mh" data-m="${mk}"><span>${mName(mk)}</span><b class="${ch < 0 ? 'neg' : ''}">${state.paHide ? '••••' : (ch >= 0 ? '+ ' : '− ') + eurR(Math.abs(ch))}</b><span>${open ? '⌃' : '⌄'}</span></div>
      ${open ? months[mk].map(k => { const d = parseKey(k), c = net[k]; return `<div class="pa-dr"><span class="d">${d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '')}<b>${String(d.getDate()).padStart(2, '0')}</b></span><span class="v">${fm(wOn(k))}</span><span class="ch ${c < 0 ? 'neg' : 'pos'}">${c >= 0 ? '+ ' : '− '}${eurR(Math.abs(c))}</span></div>`; }).join('') : ''}</div>`;
  }).join('');

  document.getElementById('paTotal').textContent = fm(total);
  document.getElementById('paEye').innerHTML = state.paHide
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-2.6 3.4M6.4 7.6A14 14 0 0 0 2.5 12C3.5 14 7 18 12 18c1.5 0 2.8-.4 4-.9"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12C3.5 10 7 6 12 6s8.5 4 9.5 6c-1 2-4.5 6-9.5 6s-8.500-4-9.500-6z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  root.innerHTML = `
    <div class="pa-card">
      <div class="pa-h"><span>Évolution du patrimoine</span></div>
      <div class="pa-big ${delta < 0 ? 'neg' : 'pos'}">${state.paHide ? '••••' : (delta >= 0 ? '+' : '−') + eurR(Math.abs(delta))}</div>
      <div class="pa-sub">Depuis le ${fd(pts[0].k)}</div>
      <div class="pa-chart" id="paChart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="paG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9a68" stop-opacity=".28"/><stop offset="1" stop-color="#3d9a68" stop-opacity=".02"/></linearGradient></defs>
        <path d="${area}" fill="url(#paG)"/><path d="${dPath}" fill="none" stroke="#2f9a5c" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <line id="paLine" x1="0" x2="0" y1="0" y2="${H}" stroke="#7aa88a" stroke-width="1.5" stroke-dasharray="4 4" style="display:none" vector-effect="non-scaling-stroke"/>
        <circle cx="${X(lastI).toFixed(1)}" cy="${Y(pts[lastI].v).toFixed(1)}" r="4" fill="#2f9a5c"/>
      </svg></div>
      <div class="pa-x"><span>${parseKey(pts[0].k).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}</span><span>${parseKey(pts[lastI].k).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}</span></div>
    </div>
    <div id="paTip"></div>
    ${secs}
    <div class="pa-hist"><h2>Historique</h2>${hist || '<div class="empty-state">Aucun mouvement pour l\'instant.</div>'}</div>`;

  root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { state.paGroup = b.dataset.g; state.paPop = null; renderPatrimoine(); });
  root.querySelectorAll('.pa-cell').forEach(c => c.onclick = () => { state.paPop = state.paPop === c.dataset.id ? null : c.dataset.id; renderPatrimoine(); });
  root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openAccWiz(null, b.dataset.add));
  root.querySelectorAll('[data-acc]').forEach(c => c.onclick = () => openAccWiz(c.dataset.acc));
  root.querySelectorAll('.pa-mh').forEach(h => h.onclick = () => { state.paOpenM = state.paOpenM === h.dataset.m ? '' : h.dataset.m; renderPatrimoine(); });

  };
  const pick = ev => { const r = ch.getBoundingClientRect(); const i = Math.max(0, Math.min(pts.length - 1, Math.round((ev.clientX - r.left) / r.width * (pts.length - 1)))); if (pts[i].k !== state.paSel) show(i); };
  let down = false;
  ch.onpointerdown = ev => { down = true; pick(ev); };
  ch.onpointermove = ev => { if (down) pick(ev); };
  const up = () => { down = false; };
  ch.onpointerup = up; ch.onpointercancel = up; ch.onpointerleave = up;
  if (state.paSel) { const i = pts.findIndex(x => x.k === state.paSel); if (i >= 0) show(i); }
}




// --- taille du montant qui s'adapte à la longueur saisie
function fitAmt(inp) {
  const len = Math.max(1, String(inp.value || '').length);
  const size = len <= 3 ? 56 : len <= 5 ? 46 : len <= 7 ? 36 : 28;
  inp.style.fontSize = size + 'px';
  if (inp.nextElementSibling) inp.nextElementSibling.style.fontSize = size + 'px';
  inp.style.width = Math.max(0.9, len * 0.75) * size + 'px';
  inp.style.width = Math.max(inp.scrollWidth + 6, parseFloat(inp.style.width) * 0.8) + 'px';
}
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('.wiz-amt input')) fitAmt(e.target); });
new MutationObserver(() => document.querySelectorAll('.wiz-amt input').forEach(fitAmt)).observe(document.body, { childList: true, subtree: true });

function openAccWiz(editId, preType) {
  const a = editId === 'main' ? { id: 'main', type: 'daily', name: 'Compte courant', amount: state.balanceStart } : (editId ? state.accounts.find(x => x.id === editId) : null);
  state.acc = a
    ? { step: 3, edit: a.id, type: a.type, name: a.name || '', val: String(Math.abs(a.amount)).replace('.', ','), neg: a.amount < 0 }
    : { step: preType ? 1 : 0, edit: null, type: preType || 'daily', name: '', val: '', neg: false };
  document.getElementById('accWiz').classList.add('open');
  renderAccWiz();
}
function closeAccWiz() { document.getElementById('accWiz').classList.remove('open'); state.acc = null; }
function accWizBack() {
  const w = state.acc; if (!w) return;
  if (w.edit || w.step === 0) return closeAccWiz();
  w.step--; renderAccWiz();
}
function accWizNext() {
  const w = state.acc; if (!w) return;
  if (w.step === 0) { w.step = 1; renderAccWiz(); return; }
  if (w.step === 1) { w.name = (document.getElementById('awName') || {}).value || w.name; w.step = 2; renderAccWiz(); return; }
  saveAccWiz();
}
async function saveAccWiz() {
  const w = state.acc; if (!w) return;
  const inp = document.getElementById('awVal');
  const raw = inp ? inp.value : w.val;
  let v = parseFloat(String(raw).replace(/\s/g, '').replace(',', '.'));
  if (isNaN(v)) { showToast('Montant invalide'); return; }
  v = Math.abs(v) * (w.neg ? -1 : 1);
  const nm = (w.step === 3 ? ((document.getElementById('awName') || {}).value || '') : w.name).trim();
  if (w.edit === 'main') {
    state.balanceStart = v; await saveBalance();
  } else if (w.edit) {
    const a = state.accounts.find(x => x.id === w.edit);
    if (a) { a.amount = v; a.name = nm || ACC_TYPES[a.type].label; }
  } else {
    state.accounts.push({ id: 'a' + Date.now().toString(36), type: w.type, name: nm || ACC_TYPES[w.type].sug[0], amount: v });
  }
  await saveAccounts();
  closeAccWiz();
  renderActive();
  if (state.tx) renderTxWiz();
  showToast(w.edit ? 'Compte mis à jour' : 'Compte ajouté');
}

  closeAccWiz();
  renderActive();
  showToast('Compte supprimé');

  document.body.appendChild(bg);

function openTxWiz(type, date) {
  if (type === 'transfer' && accList().length < 2) { showToast("Ajoute d'abord un deuxième compte"); openAccWiz(); return; }
  state.tx = { step: type === 'transfer' ? 0 : 1, type, acc: 'main', to: null, view: 'car', amount: '', name: '', cat: null, refund: false, later: false, noBal: false, date: date || todayKey() };
  document.getElementById('txWiz').classList.add('open');

}
function closeTxWiz() { document.getElementById('txWiz').classList.remove('open'); state.tx = null; }
function txBack() { const w = state.tx; if (!w) return; if (w.step === 0 || (w.type !== 'transfer' && w.step === 1)) return closeTxWiz(); w.step--; renderTxWiz(); }
function txAmount() { return parseFloat(String(state.tx.amount).replace(/\s/g, '').replace(',', '.')) || 0; }
function txNext() {
  const w = state.tx; if (!w) return;
  if (w.step < 3) { w.step++; renderTxWiz(); return; }
  saveTxWiz();
}
async function saveTxWiz() {
  const w = state.tx; if (!w) return;
  const amount = txAmount();
  if (w.type === 'transfer') {
    if (!(amount > 0) || !w.to || w.to === w.acc) return;
    const now = new Date();
    state.transfers.push({ id: 'x' + now.getTime() + Math.random().toString(36).slice(2, 7), from: w.acc, to: w.to, amount, date: w.date, ts: w.date === todayKey() ? now.getTime() : parseKey(w.date).getTime() + 43200000 });
    await saveTransfers();
    await accAdjust(w.acc, -amount); await accAdjust(w.to, amount);
    closeTxWiz(); renderActive(); showToast('Transfert effectué');
    return;
  }
  if (!(amount > 0) || !w.cat) return;
  const now = new Date(), tk = todayKey();
  const note = w.name.trim();
  const inc = w.type === 'income';
  if (w.later || w.date > tk) {
    const item = { id: 'p' + now.getTime() + Math.random().toString(36).slice(2, 7), type: w.type, label: note, amount, cat: w.cat, nextDate: w.date, recurrence: 'once', acc: w.acc };
    if (w.refund) item.refund = true;
    state.scheduled.push(item);
    await saveScheduled();
    showToast('Opération à venir ajoutée');
  } else {
    const tx = { id: 't' + now.getTime() + Math.random().toString(36).slice(2, 7), type: w.type, amount, cat: w.cat, note, date: w.date,
      ts: w.date === tk ? now.getTime() : parseKey(w.date).getTime() + 43200000, acc: w.acc };
    if (w.refund) tx.refund = true;
    if (w.noBal) tx.noBal = true;
    state.transactions.push(tx);
    await saveTransactions();
    if (!w.noBal) await accAdjust(w.acc, signedAmount(tx));
    showToast(inc ? 'Revenu ajouté' : 'Dépense ajoutée');
  }
  closeTxWiz();
  renderActive();
}

function statsCalc() {
  const r = state.stRange, y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
  let start, end, pStart, pEnd, label, vs, unit = 'day', avgDiv;
  if (r === '7d') {
    end = now; start = new Date(now); start.setDate(start.getDate() - 6);
    pEnd = new Date(start); pEnd.setDate(pEnd.getDate() - 1); pStart = new Date(pEnd); pStart.setDate(pStart.getDate() - 6);
    label = '7 derniers jours'; vs = 'vs 7 jours précédents'; avgDiv = 7;
  } else if (r === '1m') {
    start = new Date(y, m, 1); end = new Date(y, m + 1, 0);
    pStart = new Date(y, m - 1, 1); pEnd = new Date(y, m, 0);
    label = cap(monthName(y, m)); vs = 'vs ' + new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long' });
    const cur = y === now.getFullYear() && m === now.getMonth();
    avgDiv = cur ? now.getDate() : (new Date(y, m, 1) > now ? 0 : end.getDate());
  } else if (r === '1y') {
    start = new Date(y, 0, 1); end = new Date(y, 11, 31); pStart = new Date(y - 1, 0, 1); pEnd = new Date(y - 1, 11, 31);
    label = String(y); vs = 'vs ' + (y - 1); unit = 'month';
    avgDiv = y === now.getFullYear() ? now.getMonth() + 1 : (y > now.getFullYear() ? 0 : 12);
  } else {
    const ds = state.transactions.map(t => t.date).sort();
    start = ds.length ? parseKey(ds[0]) : new Date(now); start = new Date(start.getFullYear(), start.getMonth(), 1);
    end = now; pStart = null; pEnd = null; label = 'Depuis le début'; vs = ''; unit = 'month';
    avgDiv = (end.getFullYear() - start.getFullYear()) * 12 + end.getMonth() - start.getMonth() + 1;
  }
  const type = state.stType;
  const inR = (t, a, b) => { const d = parseKey(t.date); return d >= a && d <= b; };
  const txs = state.transactions.filter(t => t.type === type && inR(t, start, end));
  const total = txs.reduce((a, t) => a + t.amount, 0);
  let prev = null;
  if (pStart) prev = state.transactions.filter(t => t.type === type && inR(t, pStart, pEnd)).reduce((a, t) => a + t.amount, 0);
  // buckets
  const buckets = [];
  if (unit === 'day') { for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) buckets.push({ k: fmtKey(d), lab: String(d.getDate()), v: 0, d: new Date(d) }); }
  else { for (let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d.setMonth(d.getMonth() + 1)) buckets.push({ k: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), lab: d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '').slice(0, r === 'all' ? 3 : 1).toUpperCase(), v: 0, d: new Date(d) }); }
  txs.forEach(t => { const k = unit === 'day' ? t.date : t.date.slice(0, 7); const b = buckets.find(x => x.k === k); if (b) b.v += t.amount; });
  return { r, label, vs, unit, txs, total, prev, buckets, avg: avgDiv > 0 ? total / avgDiv : 0 };
}
function treemapLayout(items, x, y, w, h, out) {

  if (items.length === 1) { out.push({ it: items[0], x, y, w, h }); return; }
  const tot = items.reduce((a, b) => a + b.v, 0);
  let acc = 0, k = 0;
  while (k < items.length - 1 && acc + items[k].v < tot / 2) { acc += items[k].v; k++; }
  if (k === 0) { acc = items[0].v; k = 1; }
  const A = items.slice(0, k), B = items.slice(k), f = tot ? acc / tot : 0.5;
  if (w >= h) { treemapLayout(A, x, y, w * f, h, out); treemapLayout(B, x + w * f, y, w * (1 - f), h, out); }
  else { treemapLayout(A, x, y, w, h * f, out); treemapLayout(B, x, y + h * f, w, h * (1 - f), out); }
}

    const by = {}; list.forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amount);
    const rows = Object.entries(by).sort((x, y) => y[1] - x[1]);
    const mx = rows.length ? rows[0][1] : 1;
    const lab = c.unit === 'day' ? b.d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : monthName(b.d.getFullYear(), b.d.getMonth());
    det.innerHTML = `<div class="st-card"><div class="st-det-h"><span>${lab}</span><b class="${cls}">${b.v ? eurS(b.v) : ''}</b></div>` +

        : `<div class="empty-state" style="padding:14px 8px">${inc ? 'Aucun revenu' : 'Aucune dépense'} ce jour-là.</div>`) + '</div>';
  };
  const pick = ev => {
    const r = bars.getBoundingClientRect();
    const i = Math.max(0, Math.min(cols.length - 1, Math.floor((ev.clientX - r.left) / r.width * cols.length)));
    const k = c.buckets[i].k;
    if (state.stSel !== k) { state.stSel = k; showSel(); }
  };
  let down = false;
  bars.onpointerdown = ev => { down = true; pick(ev); };
  bars.onpointermove = ev => { if (down) pick(ev); };
  const up = () => { down = false; };
  bars.onpointerup = up; bars.onpointercancel = up; bars.onpointerleave = up;
  showSel();
}

function darkenColor(hex, factor = 0.92) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const r = Math.round(((n >> 16) & 255) * factor);
  const g = Math.round(((n >> 8) & 255) * factor);
  const b = Math.round((n & 255) * factor);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function renderDonutChart(txList, donutId, totalId, legendId, emptyMsg) {
  const total = txList.reduce((s,t) => s+t.amount, 0);
  document.getElementById(totalId).textContent = total > 0 ? Math.round(total) + ' €' : '0 €';

  const byCat = {};
  txList.forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + t.amount; });
  const entries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  const donut = document.getElementById(donutId);
  const legend = document.getElementById(legendId);
  if (entries.length === 0 || total === 0) {
    donut.style.background = '#ece6da';
    legend.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
    return;
  }

  let acc = 0;
  const stops = entries.map(([catId, amt]) => {
    const cat = findCat(catId);
    const start = (acc / total) * 360;
    acc += amt;
    const end = (acc / total) * 360;
    return `${darkenColor(cat.color)} ${start}deg ${end}deg`;
  });
  donut.style.background = `conic-gradient(${stops.join(', ')})`;

  legend.innerHTML = '';
  entries.forEach(([catId, amt]) => {
    const cat = findCat(catId);
    const pct = Math.round((amt/total)*100);
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <span class="legend-dot" style="background:${darkenColor(cat.color)}"></span>
      <span class="legend-ic">${cat.icon}</span>
      <span class="legend-lb">${cat.label}</span>
      <span class="legend-pct">${pct}%</span>
      <span class="legend-amt">${fmtAmount(amt)} €</span>`;
    legend.appendChild(row);
  });
}

function wizNextDate(w) {
  const start = parseKey(w.start);
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  if (w.freq === 'daily') return fmtKey(start);
  if (w.freq === 'weekly') {
    const delta = (w.wd - ((start.getDay() + 6) % 7) + 7) % 7;
    const d = new Date(start); d.setDate(d.getDate() + delta); return fmtKey(d);
  }
  if (w.freq === 'monthly') {
    let c = new Date(start.getFullYear(), start.getMonth(), Math.min(w.day, dim(start.getFullYear(), start.getMonth())));
    if (c < start) c = new Date(start.getFullYear(), start.getMonth() + 1, Math.min(w.day, dim(start.getFullYear(), start.getMonth() + 1)));
    return fmtKey(c);
  }
  let c = new Date(start.getFullYear(), w.month, Math.min(w.day, dim(start.getFullYear(), w.month)));
  if (c < start) c = new Date(start.getFullYear() + 1, w.month, Math.min(w.day, dim(start.getFullYear() + 1, w.month)));
  return fmtKey(c);
}
