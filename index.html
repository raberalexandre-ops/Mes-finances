async function wizNext() {
  const w = state.wiz;
  if (w.step < 3) { w.step++; renderWizard(); return; }
  const amount = parseFloat(String(w.amount).replace(',', '.'));
  if (!(amount > 0) || !w.cat) { showToast('Montant ou catégorie manquant'); return; }
  const item = {
    type: w.type, label: (w.name || '').trim() || findCat(w.cat).label, amount, cat: w.cat,
    nextDate: wizNextDate(w), recurrence: w.freq, interval: w.interval > 1 ? w.interval : undefined,
    day: (w.freq === 'monthly' || w.freq === 'yearly') ? w.day : undefined,
  };
  if (w.id) {
    const ex = state.scheduled.find(x => x.id === w.id);
    if (ex) { delete ex.interval; delete ex.day; Object.assign(ex, item); }
  } else {
    state.scheduled.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7), ...item });
  }
  await saveScheduled();
  showToast(w.id ? 'Modifié' : (w.type === 'income' ? 'Revenu régulier ajouté' : 'Dépense régulière ajoutée'));
  document.getElementById('wizard').classList.remove('open');
  renderActive();
  if (state.wizFromReg) openRegular(w.type);
}

  const inc = type === 'income';
  document.getElementById('regTitle').textContent = inc ? 'Revenus réguliers' : 'Dépenses régulières';
  document.getElementById('regAdd').textContent = inc ? 'Ajouter un revenu régulier' : 'Ajouter une dépense régulière';
  const list = state.scheduled.filter(p => p.type === type && p.recurrence !== 'once');
  const perMonth = p => { const n = p.interval || 1; return p.amount * ({ daily: 30, weekly: 52 / 12, monthly: 1, yearly: 1 / 12 }[p.recurrence] || 1) / n; };
  const monthly = list.reduce((s, p) => s + perMonth(p), 0);
  document.getElementById('regSub').innerHTML = list.length ? `Environ <b class="${inc ? 'pos' : 'neg'}">${eurS(monthly)}</b> par mois` : '';
  const root = document.getElementById('regList');
  root.innerHTML = '';
  if (!list.length) root.innerHTML = `<div class="empty-state">Aucun${inc ? ' revenu' : 'e dépense'} régulier${inc ? '' : 'e'} pour l'instant.</div>`;
  const groups = {};
  list.forEach(p => { const k = inc ? p.cat : grpOf(findCat(p.cat)); (groups[k] = groups[k] || []).push(p); });
  Object.entries(groups).sort((a, b) => b[1].reduce((s, p) => s + p.amount, 0) - a[1].reduce((s, p) => s + p.amount, 0)).forEach(([cid, items]) => {
    const c = inc ? findCat(cid) : groupById(cid);
    const g = document.createElement('div');
    g.className = 'reg-group ' + (inc ? 'inc' : 'exp');
    g.style.background = c.color + '26';
    g.innerHTML = `<div class="reg-gh"><span class="kc-ico" style="background:${c.color}">${c.icon}</span><span>${escapeHtml(c.label)}</span><b>${eurS(items.reduce((s, p) => s + p.amount, 0))}</b></div>`;
    items.sort((a, b) => b.amount - a.amount).forEach(p => {
      const el = document.createElement('div');
      el.className = 'reg-item';
      const pc = findCat(p.cat);
      el.innerHTML = `<div class="rmain"><span class="kc-ico" style="background:${c.color}">${pc.icon}</span><div class="ri"><div class="rn">${escapeHtml(p.label || pc.label)}</div><span class="rc">${freqText(p)}</span></div><div class="ra">${eurS(p.amount)}</div></div>
        <div class="acts"><button class="edit">Modifier</button><button class="del">Supprimer</button></div>`;
      el.querySelector('.rmain').onclick = () => el.classList.toggle('open');
      el.querySelector('.edit').onclick = () => openWizard(p.type, p.id, true);
      el.querySelector('.del').onclick = async () => { await deleteScheduled(p.id); renderRegular(); };
      g.appendChild(el);
    });
    root.appendChild(g);
  });
}
function closeAnySheet() {
  closeRegular();
  closeSheet();
  closeManageCats();
}

function renderManageCats() {
  renderManageCatList('expense', document.getElementById('manageCatListExpense'));
  renderManageCatList('income', document.getElementById('manageCatListIncome'));
}

function renderManageCatList(type, container) {
  const list = catsFor(type);
  container.innerHTML = '';
  list.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'manage-cat-row';
    row.innerHTML = `
      <span class="ic">${cat.icon}</span>
      <span class="lb">${escapeHtml(cat.label)}</span>
      <button class="icon-btn" data-action="edit" title="Renommer">✎</button>
      <button class="icon-btn danger" data-action="delete" title="Supprimer">🗑</button>`;
    row.querySelector('[data-action="edit"]').onclick = () => startEditCat(type, cat.id, container);
    row.querySelector('[data-action="delete"]').onclick = () => startDeleteCat(type, cat.id, container);
    container.appendChild(row);
  });
}

function startEditCat(type, catId, container) {
  renderManageCatList(type, container); // reset any other open row first
  const list = catsFor(type);
  const cat = list.find(c => c.id === catId);
  if (!cat) return;
  const rows = container.querySelectorAll('.manage-cat-row');
  const idx = list.findIndex(c => c.id === catId);
  const targetRow = rows[idx];
  const editRow = document.createElement('div');
  editRow.className = 'manage-cat-edit-row';
  editRow.innerHTML = `
    <span class="ic">${cat.icon}</span>
    <input type="text" class="text-field" value="${escapeHtml(cat.label)}" maxlength="18" style="margin-bottom:0;">
    <button class="icon-btn" data-action="save" title="Valider">✓</button>
    <button class="icon-btn" data-action="cancel" title="Annuler">✕</button>`;
  targetRow.replaceWith(editRow);
  const input = editRow.querySelector('input');
  setTimeout(() => { input.focus(); input.select(); }, 30);
  editRow.querySelector('[data-action="cancel"]').onclick = () => renderManageCatList(type, container);
  editRow.querySelector('[data-action="save"]').onclick = async () => {
    const newLabel = input.value.trim();
    if (!newLabel) { showToast('Indiquez un nom'); return; }
    cat.label = newLabel;
    await saveCatsFor(type);
    renderManageCatList(type, container);
    renderActive();
    showToast('Catégorie renommée');
  };
}

function startDeleteCat(type, catId, container) {
  const list = catsFor(type);
  if (list.length <= 1) { showToast('Il faut garder au moins une catégorie'); return; }
  renderManageCatList(type, container);
  const cat = list.find(c => c.id === catId);
  if (!cat) return;
  const idx = list.findIndex(c => c.id === catId);
  const rows = container.querySelectorAll('.manage-cat-row');
  const targetRow = rows[idx];
  const confirmRow = document.createElement('div');
  confirmRow.className = 'manage-cat-confirm-row';
  confirmRow.innerHTML = `
    <span class="msg">Supprimer "${escapeHtml(cat.label)}" ?</span>
    <button class="confirm-no" data-action="no">Annuler</button>
    <button class="confirm-yes" data-action="yes">Supprimer</button>`;
  targetRow.replaceWith(confirmRow);
  confirmRow.querySelector('[data-action="no"]').onclick = () => renderManageCatList(type, container);
  confirmRow.querySelector('[data-action="yes"]').onclick = async () => {
    const newList = catsFor(type).filter(c => c.id !== catId);
    if (type === 'income') state.incomeCats = newList; else state.expenseCats = newList;
    await saveCatsFor(type);
    renderManageCatList(type, container);
    renderActive();
    showToast('Catégorie supprimée');
  };
}

async function saveOperation() {
  const amount = parseFloat(document.getElementById('amountInput').value.replace(',', '.'));
  if (!(amount > 0)) { showToast('Indiquez un montant'); return; }
  if (!state.selectedCat) { showToast('Choisissez une catégorie'); return; }
  const note = document.getElementById('noteInput').value.trim();
  const date = document.getElementById('dateInput').value || todayKey();
  const rec = document.getElementById('recSelect').value;
  const now = new Date();

  if (state.editingId) {
    const item = state.scheduled.find(x => x.id === state.editingId);
    if (item) {
      Object.assign(item, { type: state.selectedType, label: note, amount, cat: state.selectedCat, nextDate: date, recurrence: rec });
      await saveScheduled();
      showToast('Opération modifiée');
    }
    closeSheet();
    switchTab('budget');
    return;
  }

  if (rec === 'once' && date <= todayKey()) {
    const tx = {
      id: 't' + now.getTime() + Math.random().toString(36).slice(2,7),
      type: state.selectedType, amount, cat: state.selectedCat, note,
      date, ts: date === todayKey() ? now.getTime() : parseKey(date).getTime() + 43200000,
    };
    state.transactions.push(tx);
    await saveTransactions();
    state.balanceStart += signedAmount(tx);
    await saveBalance();
    showToast(state.selectedType === 'income' ? 'Recette ajoutée' : 'Dépense ajoutée');
  } else {
    const item = {
      id: 'p' + now.getTime() + Math.random().toString(36).slice(2,7),
      type: state.selectedType, label: note, amount, cat: state.selectedCat,
      nextDate: date, recurrence: rec,
    };
    state.scheduled.push(item);
    await saveScheduled();
    showToast('Opération anticipée ajoutée');
  }
  closeSheet();
  switchTab('budget');
}

// ---------- Init ----------
async function init() {
  document.querySelectorAll('#typeToggle .type-btn').forEach(btn => btn.onclick = () => setType(btn.dataset.type));

  await loadAll();
  state.viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  switchTab('activity');

  document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));
  document.querySelectorAll('#heroSubtabs button').forEach(b => b.onclick = () => { state.budgetTab = b.dataset.sub; state.calSelected = null; renderActive(); });
  document.querySelectorAll('#heroPeriod button').forEach(b => b.onclick = () => { state.period = b.dataset.p; state.calSelected = null; renderActive(); });
  document.querySelectorAll('#heroStat button').forEach(b => b.onclick = () => { state.stRange = b.dataset.r; state.stSel = null; renderActive(); });
  document.getElementById('mPrev').onclick = () => shiftMonth(-1);
  document.getElementById('mNext').onclick = () => shiftMonth(1);

  document.getElementById('fabRound').onclick = () => openSheet();
  document.getElementById('regClose').onclick = closeRegular;
  document.getElementById('regX').onclick = closeRegular;
  document.getElementById('regAdd').onclick = () => openWizard(state.regType, null, true);
  document.getElementById('wizNext').onclick = wizNext;
  document.getElementById('wizClose').onclick = closeWizard;
  document.getElementById('wizBack').onclick = () => { const w = state.wiz; if (w.step > 0) { w.step = w.step === 3 ? 2 : w.step - 1; renderWizard(); } else closeWizard(); };
  document.getElementById('cancelBtn').onclick = closeSheet;
  document.getElementById('overlay').onclick = closeAnySheet;
  document.getElementById('saveBtn').onclick = saveOperation;
  document.getElementById('amountInput').addEventListener('input', updateSaveState);
  document.getElementById('dateInput').addEventListener('input', updateAnticipNote);
  document.getElementById('recSelect').addEventListener('change', updateAnticipNote);
  document.querySelectorAll('#heroPat [data-r]').forEach(b => b.onclick = () => { state.paRange = b.dataset.r; state.paSel = null; renderActive(); });
  document.getElementById('paEye').onclick = () => { state.paHide = !state.paHide; renderActive(); };

  document.getElementById('manageCatsBtn').onclick = openManageCats;
  document.getElementById('manageCatsCloseBtn').onclick = closeManageCats;
}

init();
</script>
