<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<title>Finances</title>
<style>
  :root {
    --bg: #000000;
    --bg-elevated: #0c0d0f;
    --bg-input: #131416;
    --border: #1c1e21;
    --text: #e6e3dc;
    --text-dim: #85878d;
    --text-faint: #54565b;
    --accent: #E1DCC9;
    --accent-dim: #8a8578;
    --danger: #a64a40;
    --ok: #6b9374;
    --text-hi: #f2efe8;
    --ok-hi: #8cbf99;
    --danger-hi: #d9776b;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }

  .tabbar { display: flex; gap: 4px; padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .tab-btn { flex: 1; background: none; border: none; color: var(--text-faint); font-size: 13px; font-weight: 500; padding: 9px 2px; border-radius: 9px; cursor: pointer; }
  .tab-btn.active { background: var(--bg-elevated); color: var(--accent); }

  .view { display: none; padding-bottom: 140px; }
  .view.active { display: block; }

  /* ---------- Balance card ---------- */
  .balance-card { padding: 18px 20px 8px; }
  .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .balance-box { border-radius: 16px; padding: 16px 14px; border: 1px solid var(--border); background: var(--bg-elevated); }
  .balance-box.projected { background: rgba(88,120,160,0.07); border-color: rgba(88,120,160,0.28); }
  .total-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .solde-amount { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .solde-amount span { font-size: 18px; font-weight: 400; }
  .solde-amount.pos { color: var(--ok); }
  .solde-amount.neg { color: var(--danger); }
  .edit-link { background: none; border: none; color: var(--accent); font-size: 12px; padding: 8px 0 0; cursor: pointer; }

  /* ---------- Period nav + totals ---------- */
  .period-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 4px; }
  .period-label { font-size: 13.5px; color: var(--text); text-transform: capitalize; font-weight: 500; }
  .nav-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; padding: 4px 10px; cursor: pointer; line-height: 1; }
  .nav-btn:active { color: var(--text); }

  .totals-row { display: flex; gap: 10px; padding: 10px 20px 4px; }
  .totals-box { flex: 1; background: var(--bg-elevated); border-radius: 12px; padding: 12px 14px; }
  .totals-box .lb { font-size: 11.5px; color: var(--text-faint); margin-bottom: 3px; }
  .totals-box .amt { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .totals-box .amt.income { color: var(--ok); }
  .totals-box .amt.expense { color: var(--text); }

  .section-title { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 20px 8px; }
  .empty-state { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 30px 20px; line-height: 1.6; }

  /* ---------- Upcoming operations ---------- */
  /* Dropdown (collapsible) groups */
  .dd-collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.25s ease; }
  .dd.collapsed > .dd-collapse { grid-template-rows: 0fr; }
  .dd-inner { overflow: hidden; min-height: 0; }
  .dd-header { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #15171a; border: none; color: var(--text-hi); padding: 14px 16px; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; text-align: left; }
  .dd-header:active { background: #1b1e22; }
  .dd-title { display: flex; align-items: center; gap: 8px; }
  .dd-count { background: #262a30; color: var(--text-hi); border-radius: 20px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
  .dd-right { display: flex; align-items: center; gap: 10px; }
  .dd-total { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dd-total.pos { color: var(--ok-hi); }
  .dd-total.neg { color: var(--danger-hi); }
  .dd-chevron { width: 16px; height: 16px; color: var(--text-dim); transition: transform 0.25s ease; flex-shrink: 0; }
  .dd.collapsed > .dd-header .dd-chevron { transform: rotate(-90deg); }

  .dd-main-wrap { margin: 22px 16px 0; background: var(--bg-elevated); border: 1px solid #2b2e33; border-radius: 16px; overflow: hidden; }
  .dd-main { box-shadow: inset 3px 0 0 var(--accent); padding-left: 18px; font-size: 14px; }

  .dd-header.static { cursor: default; }
  .dd-header.static:active { background: #15171a; }
  .history-body { padding: 0; }
  .dd-day { border-top: 1px solid #24272b; }
  .dd-day > .dd-header { background: var(--bg-elevated); font-size: 13px; font-weight: 500; padding: 12px 16px; }
  .dd-day > .dd-header:active { background: #15171a; }
  .dd-day .dd-title { text-transform: capitalize; color: var(--text); }
  .dd-day .dd-total { font-size: 13px; }
  .dd-day .dd-total.neg { color: var(--text-dim); }
  .dd-day .dd-count { background: #1c1f23; color: var(--text-dim); }
  .dd-day .tx-row { padding: 11px 16px; border-top: 1px solid #24272b; border-bottom: none; background: var(--bg); }

  /* Upcoming calendar */
  .view-toggle { display: flex; gap: 4px; margin: 12px 16px 4px; background: #0f1113; border: 1px solid #24272b; border-radius: 10px; padding: 3px; }
  .view-toggle button { flex: 1; background: transparent; border: none; color: var(--text-dim); font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 7px; border-radius: 8px; cursor: pointer; }
  .view-toggle button.on { background: #22252a; color: var(--text-hi); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px 12px 12px; }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--text-faint); padding: 4px 0; text-transform: uppercase; }
  .cal-day { aspect-ratio: 1 / 1.15; border-radius: 10px; background: #0c0d0f; border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 1px 2px; gap: 2px; font-family: inherit; color: var(--text); cursor: pointer; min-width: 0; }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day .n { font-size: 12.5px; font-weight: 500; }
  .cal-day.has { background: #15171a; }
  .cal-day.today { border-color: var(--accent-dim); }
  .cal-day.sel { background: #25282d; border-color: var(--accent); }
  .cal-dots { display: flex; gap: 2px; height: 5px; }
  .cal-dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .cal-dots i.e { background: var(--danger-hi); }
  .cal-dots i.i { background: var(--ok-hi); }
  .cal-amt { font-size: 8.5px; font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .cal-detail-title { padding: 10px 16px 8px; font-size: 12px; color: var(--text-dim); text-transform: capitalize; border-top: 1px solid #24272b; display: flex; justify-content: space-between; }
  .cal-detail-empty { padding: 4px 16px 16px; font-size: 12.5px; color: var(--text-faint); }
  .dd-sub { border-top: 1px solid #2b2e33; }
  .dd-sub > .dd-header { background: #0f1113; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 11px 16px; }
  .dd-sub > .dd-header:active { background: #15171a; }
  .dd-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dd-sub.expense .dd-dot { background: var(--danger-hi); }
  .dd-sub.income .dd-dot { background: var(--ok-hi); }

  .upcoming-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #24272b; background: var(--bg); }
  .cat-dot { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: var(--bg-elevated); }
  .up-info { flex: 1; min-width: 0; }
  .up-label { font-size: 14px; font-weight: 500; color: var(--text-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-meta { font-size: 11px; color: var(--text-dim); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .badge { background: #1f2227; color: #a9abb1; border-radius: 6px; padding: 2px 7px; font-size: 10px; font-weight: 500; }
  .badge.late { background: rgba(166,74,64,0.22); color: var(--danger-hi); }
  .badge.today { background: rgba(225,220,201,0.22); color: #E1DCC9; }
  .up-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  .up-amt { font-size: 14.5px; font-weight: 600; color: var(--text-hi); font-variant-numeric: tabular-nums; }
  .up-amt.income { color: var(--ok-hi); }
  .mini-actions { display: flex; gap: 6px; }
  .mini-btn { background: transparent; border: 1px solid #2f3338; border-radius: 8px; font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer; padding: 4px 9px; }
  .mini-btn.pay { color: var(--ok-hi); border-color: rgba(107,147,116,0.55); }
  .mini-btn.pay:active { background: rgba(107,147,116,0.18); }
  .mini-btn.edit { color: var(--accent); border-color: rgba(225,220,201,0.35); }
  .mini-btn.del { color: var(--text-dim); }
  .mini-btn.del:active { color: var(--danger-hi); border-color: var(--danger); }

  /* ---------- History grouped by day ---------- */
  .day-group { margin: 0 20px; }
  .day-header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; }
  .day-header .lb { font-size: 12.5px; color: var(--text-dim); text-transform: capitalize; font-weight: 500; }
  .day-header .amt { font-size: 12px; font-variant-numeric: tabular-nums; }
  .day-header .amt.pos { color: var(--ok); }
  .day-header .amt.neg { color: var(--text-faint); }

  .tx-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .tx-row:last-child { border-bottom: none; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 14px; color: var(--text); }
  .tx-time { font-size: 11px; color: var(--text-faint); }
  .tx-amt { font-size: 14.5px; font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .tx-amt.income { color: var(--ok); }
  .del-btn { background: none; border: none; color: var(--text-faint); font-size: 16px; padding: 4px 4px 4px 8px; cursor: pointer; flex-shrink: 0; }
  .del-btn:active { color: var(--danger); }

  /* ---------- Categories tab / donut ---------- */
  .donut-wrap { display: flex; justify-content: center; padding: 10px 0 6px; }
  .donut { width: 180px; height: 180px; border-radius: 50%; position: relative; }
  .donut-hole { position: absolute; top: 22px; left: 22px; right: 22px; bottom: 22px; background: var(--bg); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-hole .amt { font-size: 19px; font-weight: 600; }
  .donut-hole .lb { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .legend { padding: 6px 20px 0; }
  .legend-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .legend-row:last-child { border-bottom: none; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-ic { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
  .legend-lb { flex: 1; font-size: 13.5px; color: var(--text-dim); }
  .legend-pct { font-size: 12px; color: var(--text-faint); width: 36px; text-align: right; }
  .legend-amt { font-size: 13.5px; color: var(--text); width: 74px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Add bar / sheet ---------- */
  .add-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg-elevated); border-top: 1px solid var(--border); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .fab { width: 100%; background: #9A8678; color: #16140f; border: none; border-radius: var(--radius); padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .fab:active { background: #847264; }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 10; }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: 100%; max-width: 480px; background: var(--bg-elevated); border-radius: 20px 20px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); transition: transform 0.25s cubic-bezier(.32,.72,0,1); z-index: 11; border-top: 1px solid var(--border); max-height: 88vh; overflow-y: auto; }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }

  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .type-btn { text-align: center; padding: 11px 4px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-dim); font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .type-btn.selected.expense { border-color: var(--accent); background: rgba(225,220,201,0.1); color: var(--text); }
  .type-btn.selected.income { border-color: var(--ok); background: rgba(107,147,116,0.12); color: var(--text); }

  .amount-input-row { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin-bottom: 18px; }
  .amount-input-row .curr { font-size: 24px; color: var(--text-faint); }
  .amount-field { background: none; border: none; color: var(--text); font-size: 42px; font-weight: 600; width: 180px; text-align: center; outline: none; font-variant-numeric: tabular-nums; }
  .amount-field::placeholder { color: var(--text-faint); }

  .field-label { font-size: 12px; color: var(--text-faint); margin: 0 2px 6px; }
  .text-field { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; }
  .text-field::placeholder { color: var(--text-faint); }
  .text-field:focus { border-color: var(--accent-dim); }

  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .cat-btn { background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; color: var(--text-dim); }
  .cat-btn .ic { font-size: 18px; display: block; margin-bottom: 4px; }
  .cat-btn .lb { font-size: 10.5px; }
  .cat-btn.selected { border-color: var(--accent); background: rgba(225,220,201,0.1); color: var(--text); }
  .cat-btn.add-cat { border-style: dashed; color: var(--text-faint); }
  .custom-cat-form { grid-column: 1 / -1; margin: -8px 0 16px; }

  .manage-cat-group-title { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 2px 8px; }
  .manage-cat-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .manage-cat-row .ic { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
  .manage-cat-row .lb { flex: 1; font-size: 14px; color: var(--text); }
  .manage-cat-row .icon-btn { background: none; border: none; color: var(--text-faint); font-size: 15px; padding: 4px 8px; cursor: pointer; }
  .manage-cat-row .icon-btn:active { color: var(--accent); }
  .manage-cat-row .icon-btn.danger:active { color: var(--danger); }
  .manage-cat-edit-row { display: flex; gap: 8px; padding: 8px 0; align-items: center; }
  .manage-cat-edit-row input { flex: 1; }
  .manage-cat-confirm-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .manage-cat-confirm-row .msg { flex: 1; font-size: 13px; color: var(--text-dim); }
  .manage-cat-confirm-row button { font-size: 12px; padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; }
  .manage-cat-confirm-row .confirm-yes { background: var(--danger); color: white; }
  .manage-cat-confirm-row .confirm-no { background: var(--bg-input); color: var(--text-dim); }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-2 .text-field { width: 100%; min-width: 0; box-sizing: border-box; }
  #dateInput, #recSelect { height: 46px; font-size: 13.5px; padding: 0 10px; -webkit-appearance: none; appearance: none; }
  #recSelect { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b8d93'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 26px; }

  .seg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .seg-btn { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 9px 4px; text-align: center; cursor: pointer; color: var(--text-dim); font-size: 12px; }
  .seg-btn.selected { border-color: var(--accent); background: rgba(225,220,201,0.1); color: var(--text); }

  .anticip-note { font-size: 11.5px; color: var(--text-faint); margin: -8px 2px 16px; line-height: 1.5; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn-cancel, .btn-save { flex: 1; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
  .btn-cancel { background: var(--bg-input); color: var(--text-dim); }
  .btn-save { background: var(--accent); color: #16140f; }
  .btn-save:disabled, .btn-save.btn-save-dim { background: var(--bg-input); color: var(--text-faint); }

  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-40px); background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: all 0.25s ease; z-index: 20; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="tabbar">
  <button class="tab-btn active" data-tab="account">Compte</button>
  <button class="tab-btn" data-tab="categories">Catégories</button>
</div>

<!-- COMPTE -->
<div class="view active" id="view-account">
  <div class="balance-card">
    <div class="balance-grid">
      <div class="balance-box actual">
        <div class="total-label">Solde actuel</div>
        <div class="solde-amount" id="soldeActuel">0<span>,00 €</span></div>
        <button class="edit-link" id="editBalanceBtn">Modifier</button>
      </div>
      <div class="balance-box projected">
        <div class="total-label">Prévisionnel (fin de mois)</div>
        <div class="solde-amount" id="soldePrev">0<span>,00 €</span></div>
      </div>
    </div>
    <div class="balance-edit-row" id="balanceEditRow" style="display:none; margin-top:12px;">
      <input type="text" inputmode="decimal" id="balanceEditInput" class="text-field" style="margin-bottom:8px;" placeholder="0,00">
      <div style="display:flex; gap:8px;">
        <button class="btn-cancel" id="balanceEditCancel" style="flex:1; padding:11px;">Annuler</button>
        <button class="btn-save" id="balanceEditSave" style="flex:1; padding:11px;">OK</button>
      </div>
    </div>
  </div>

  <div class="period-nav-row">
    <button class="nav-btn" id="monthPrev">‹</button>
    <div class="period-label" id="monthLabel">—</div>
    <button class="nav-btn" id="monthNext">›</button>
  </div>
  <div class="totals-row">
    <div class="totals-box"><div class="lb">Recettes</div><div class="amt income" id="totalIncome">+0,00 €</div></div>
    <div class="totals-box"><div class="lb">Dépenses</div><div class="amt expense" id="totalExpense">-0,00 €</div></div>
  </div>

  <div class="dd dd-main-wrap" id="upcomingSection">
    <button type="button" class="dd-header dd-main" id="upcomingTitle" aria-expanded="true">
      <span class="dd-title">Opérations à venir<span class="dd-count" id="upcomingCount">0</span></span>
      <span class="dd-right">
        <span class="dd-total" id="upcomingTotal">0,00 €</span>
        <svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </button>
    <div class="dd-collapse"><div class="dd-inner"><div class="view-toggle" id="upViewToggle">
      <button type="button" data-v="list">Liste</button><button type="button" data-v="calendar">Calendrier</button>
    </div>
    <div id="upcomingCalendar"></div>
    <div id="upcomingList"></div></div></div>
  </div>

  <div class="dd dd-main-wrap" id="historySection">
    <div class="dd-header dd-main static" id="historyTitle">

<script>
const DEFAULT_EXPENSE_CATEGORIES = [

  { id: 'autre_d', label: 'Autre', icon: '•••', color: '#8b8d93' },
];
const DEFAULT_INCOME_CATEGORIES = [
  { id: 'salaire', label: 'Salaire', icon: '💼', color: '#7fa686' },
  { id: 'vente', label: 'Vente', icon: '🏷️', color: '#6c93c2' },
  { id: 'remboursement', label: 'Rembours.', icon: '💶', color: '#b98fce' },
  { id: 'virement', label: 'Virement', icon: '🔁', color: '#cf7a9c' },
  { id: 'tips', label: 'Tips', icon: '💰', color: '#e0804a' },
  { id: 'autre_i', label: 'Autre', icon: '•••', color: '#8b8d93' },
];
const FALLBACK_CAT = { id: '__inconnu__', label: 'Autre', icon: '•••', color: '#8b8d93' };
function allCats() { return [...state.expenseCats, ...state.incomeCats]; }
function findCat(id) { return allCats().find(c => c.id === id) || FALLBACK_CAT; }
function catsFor(type) { return type === 'income' ? state.incomeCats : state.expenseCats; }
const CUSTOM_CAT_COLORS = ['#d6bfa6', '#6c93c2', '#7fa686', '#cf7a9c', '#b98fce', '#d98a53'];

const REC_LABELS = { once: 'Unique', weekly: 'Chaque semaine', monthly: 'Chaque mois', yearly: 'Chaque année' };

const state = {
  activeTab: 'account',
  viewMonth: new Date(),
  catMonth: new Date(),
  transactions: [],
  scheduled: [],
  balanceStart: 0,
  expenseCats: [],
  incomeCats: [],
  selectedType: 'expense',
  selectedCat: null,
};

// ---------- Date helpers ----------
function parseKey(key) { return new Date(key + 'T00:00:00'); }
function fmtKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayKey() { return fmtKey(new Date()); }
function fmtAmount(n) { const s = Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? '-' : '') + s; }
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function signedAmount(t) { return t.type === 'income' ? t.amount : -t.amount; }
function fmtMonthLabel(d) { return d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
function fmtDayLabel(d) {
  const key = fmtKey(d);
  if (key === todayKey()) return "Aujourd'hui";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (key === fmtKey(y)) return "Hier";
  const t = new Date(); t.setDate(t.getDate() + 1);
  if (key === fmtKey(t)) return "Demain";
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function daysUntil(key) { return Math.round((parseKey(key) - parseKey(todayKey())) / 86400000); }
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

// ---------- Storage (localStorage — saves directly on this device/browser, no account needed) ----------
async function loadAll() {
  try {
    const raw = localStorage.getItem('fin_transactions');
    state.transactions = raw ? JSON.parse(raw) : [];
  } catch (e) { state.transactions = []; }
  try {
    const raw2 = localStorage.getItem('fin_scheduled');
    state.scheduled = raw2 ? JSON.parse(raw2) : [];
  } catch (e) { state.scheduled = []; }
  try {
    const raw3 = localStorage.getItem('fin_balance_start');
    state.balanceStart = raw3 ? parseFloat(raw3) : 0;
  } catch (e) { state.balanceStart = 0; }
  try {
    const rawE = localStorage.getItem('fin_expense_cats');
    if (rawE) {
      state.expenseCats = JSON.parse(rawE);
    } else {
      // first run (or migrating from the old custom-categories model)
      let migrated = [];
      try {
        const oldCustom = localStorage.getItem('fin_custom_cats');
        if (oldCustom) migrated = (JSON.parse(oldCustom).expense || []);
      } catch (e) {}
      state.expenseCats = [...DEFAULT_EXPENSE_CATEGORIES, ...migrated];
    }
  } catch (e) { state.expenseCats = [...DEFAULT_EXPENSE_CATEGORIES]; }
  try {
    const rawI = localStorage.getItem('fin_income_cats');
    if (rawI) {
      state.incomeCats = JSON.parse(rawI);
    } else {
      let migrated = [];
      try {
        const oldCustom = localStorage.getItem('fin_custom_cats');
        if (oldCustom) migrated = (JSON.parse(oldCustom).income || []);
      } catch (e) {}
      state.incomeCats = [...DEFAULT_INCOME_CATEGORIES, ...migrated];
    }
  } catch (e) { state.incomeCats = [...DEFAULT_INCOME_CATEGORIES]; }

  // Remap the old mustard/yellow category colors that may be saved on this device
  const LEGACY_YELLOWS = ['#e0b64f', '#c99a4b'];
  [...state.expenseCats, ...state.incomeCats].forEach(c => {
    if (c && LEGACY_YELLOWS.includes((c.color || '').toLowerCase())) {
      c.color = c.id === 'tips' ? '#e0804a' : '#d6bfa6';
    }
  });
}
async function saveExpenseCats() {
  try { localStorage.setItem('fin_expense_cats', JSON.stringify(state.expenseCats)); }
  catch (e) { showToast("Erreur d'enregistrement"); }
}
async function saveIncomeCats() {
  try { localStorage.setItem('fin_income_cats', JSON.stringify(state.incomeCats)); }
  catch (e) { showToast("Erreur d'enregistrement"); }
}
function saveCatsFor(type) { return type === 'income' ? saveIncomeCats() : saveExpenseCats(); }

async function saveTransactions() {
  try { localStorage.setItem('fin_transactions', JSON.stringify(state.transactions)); }
  catch (e) { showToast("Erreur d'enregistrement"); }
}
async function saveScheduled() {

  catch (e) { showToast("Erreur d'enregistrement"); }
}

}

// ---------- Tabs ----------
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  renderActive();
}
function renderActive() {
  if (state.activeTab === 'account') renderAccount();
  else renderCategories();
}

// ---------- Recurrence / projection helpers ----------
function advanceDate(key, recurrence) {
  const d = parseKey(key);
  if (recurrence === 'weekly') d.setDate(d.getDate() + 7);
  else if (recurrence === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (recurrence === 'yearly') d.setFullYear(d.getFullYear() + 1);
  return fmtKey(d);
}
function occurrencesInWindow(item, horizonKey) {
  const tKey = todayKey();
  let cursorKey = item.nextDate < tKey ? tKey : item.nextDate;
  const results = [];
  if (item.recurrence === 'once') {
    if (cursorKey <= horizonKey) results.push(cursorKey);
    return results;
  }
  let guard = 0;
  while (cursorKey <= horizonKey && guard < 60) {
    results.push(cursorKey);
    cursorKey = advanceDate(cursorKey, item.recurrence);
    guard++;
  }
  return results;
}
function occurrencesInMonth(item, year, month) {
  const monthStartKey = fmtKey(new Date(year, month, 1));
  const monthEndKey = fmtKey(new Date(year, month + 1, 0));
  const results = [];
  if (item.recurrence === 'once') {
    if (item.nextDate >= monthStartKey && item.nextDate <= monthEndKey) results.push(item.nextDate);
    return results;
  }
  let cursorKey = item.nextDate;
  let guard = 0;
  while (cursorKey <= monthEndKey && guard < 60) {
    if (cursorKey >= monthStartKey) results.push(cursorKey);
    cursorKey = advanceDate(cursorKey, item.recurrence);
    guard++;
  }
  return results;
}
function computeProjection() {
  const now = new Date();
  const horizon = new Date(now.getFullYear(), now.getMonth() + 1, 0); // last day of current month
  const horizonKey = fmtKey(horizon);
  let total = 0;
  state.scheduled.forEach(item => {
    const occ = occurrencesInWindow(item, horizonKey);
    const amt = item.type === 'income' ? item.amount : -item.amount;
    total += amt * occ.length;
  });
  return state.balanceStart + total;
}

// ---------- ACCOUNT TAB ----------
function renderAccount() {
  setSoldeActuel();
  const proj = computeProjection();
  const projEl = document.getElementById('soldePrev');
  const [pip, pdp] = fmtAmount(Math.abs(proj)).split(',');
  const psign = proj < 0 ? '-' : '';
  projEl.innerHTML = `${psign}${pip}<span>,${pdp} €</span>`;
  projEl.className = 'solde-amount ' + (proj >= 0 ? 'pos' : 'neg');

  document.getElementById('monthLabel').textContent = fmtMonthLabel(state.viewMonth);
  const y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
  const monthTx = state.transactions.filter(t => { const d = parseKey(t.date); return d.getFullYear()===y && d.getMonth()===m; });
  const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('totalIncome').textContent = '+' + fmtAmount(income) + ' €';
  document.getElementById('totalExpense').textContent = '-' + fmtAmount(expense) + ' €';

  renderUpcoming();
  renderHistory(monthTx);
}

function setSoldeActuel() {
  const [ip, dp] = fmtAmount(Math.abs(state.balanceStart)).split(',');
  const sign = state.balanceStart < 0 ? '-' : '';
  const el = document.getElementById('soldeActuel');
  el.innerHTML = `${sign}${ip}<span>,${dp} €</span>`;
  el.className = 'solde-amount ' + (state.balanceStart >= 0 ? 'pos' : 'neg');
}

function renderUpcoming() {
  const y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
  const occurrences = [];
  state.scheduled.forEach(p => {
    occurrencesInMonth(p, y, m).forEach(date => occurrences.push({ p, date }));
  });
  occurrences.sort((a,b) => a.date.localeCompare(b.date));

  const sectionEl = document.getElementById('upcomingSection');
  const listEl = document.getElementById('upcomingList');
  if (occurrences.length === 0) {
    sectionEl.style.display = 'none';
    listEl.innerHTML = '';
    return;
  }
  sectionEl.style.display = '';

  const net = occurrences.reduce((s, { p }) => s + (p.type === 'income' ? p.amount : -p.amount), 0);
  const totalEl = document.getElementById('upcomingTotal');
  totalEl.textContent = (net >= 0 ? '+' : '-') + fmtAmount(Math.abs(net)) + ' €';
  totalEl.className = 'dd-total ' + (net >= 0 ? 'pos' : 'neg');
  document.getElementById('upcomingCount').textContent = occurrences.length;
  bindDropdown(sectionEl, 'upcoming');

  // view toggle
  let view = 'calendar';
  try { view = localStorage.getItem('fin_upcoming_view') || 'calendar'; } catch (e) {}
  const toggle = document.getElementById('upViewToggle');
  toggle.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === view);
    b.onclick = () => {
      try { localStorage.setItem('fin_upcoming_view', b.dataset.v); } catch (e) {}
      renderUpcoming();
    };
  });
  const calEl = document.getElementById('upcomingCalendar');
  listEl.style.display = view === 'list' ? '' : 'none';
  calEl.style.display = view === 'calendar' ? '' : 'none';

  listEl.innerHTML = '';
  calEl.innerHTML = '';
  if (view === 'list') {
    const expenses = occurrences.filter(o => o.p.type !== 'income');
    const incomes = occurrences.filter(o => o.p.type === 'income');
    if (expenses.length) listEl.appendChild(buildUpcomingGroup('expense', expenses));
    if (incomes.length) listEl.appendChild(buildUpcomingGroup('income', incomes));
    bindUpcomingActions(listEl);
  } else {
    renderUpcomingCalendar(calEl, occurrences, y, m);
  }
}

function bindUpcomingActions(root) {
  root.querySelectorAll('.mini-btn.edit').forEach(btn => btn.onclick = () => openSheet(btn.dataset.id));
  root.querySelectorAll('.mini-btn.pay').forEach(btn => btn.onclick = () => markDone(btn.dataset.id, btn.dataset.date));
  root.querySelectorAll('.mini-btn.del').forEach(btn => btn.onclick = () => deleteScheduled(btn.dataset.id));
}

function fmtCompact(n) {
  const a = Math.abs(n);
  const s = a >= 1000 ? (Math.round(a / 100) / 10).toString().replace('.', ',') + 'k' : Math.round(a).toString();
  return (n >= 0 ? '+' : '-') + s;
}

function renderUpcomingCalendar(root, occurrences, y, m) {
  const byDate = {};
  occurrences.forEach(o => { (byDate[o.date] = byDate[o.date] || []).push(o); });
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${y}-${pad(m + 1)}-${pad(d)}`;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first
  const today = todayKey();

  if (!state.calSelected || !state.calSelected.startsWith(`${y}-${pad(m + 1)}-`)) {
    state.calSelected = byDate[today] || today.startsWith(`${y}-${pad(m + 1)}-`)
      ? today
      : Object.keys(byDate).sort()[0];
  }

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  ['L','M','M','J','V','S','D'].forEach(l => {
    const h = document.createElement('div'); h.className = 'cal-dow'; h.textContent = l; grid.appendChild(h);
  });
  for (let i = 0; i < offset; i++) {
    const e = document.createElement('div'); e.className = 'cal-day empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const k = keyOf(d);
    const ops = byDate[k] || [];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cal-day' + (ops.length ? ' has' : '') + (k === today ? ' today' : '') + (k === state.calSelected ? ' sel' : '');
    b.dataset.date = k;
    let inner = `<span class="n">${d}</span>`;
    if (ops.length) {
      const net = ops.reduce((s, { p }) => s + (p.type === 'income' ? p.amount : -p.amount), 0);
      const dots = ops.slice(0, 3).map(({ p }) => `<i class="${p.type === 'income' ? 'i' : 'e'}"></i>`).join('');
      inner += `<span class="cal-dots">${dots}</span><span class="cal-amt">${fmtCompact(net)}</span>`;
    }
    b.innerHTML = inner;
    b.onclick = () => { state.calSelected = k; renderUpcoming(); };
    grid.appendChild(b);
  }
  root.appendChild(grid);

  const sel = state.calSelected;
  const selOps = (sel && byDate[sel]) || [];
  const title = document.createElement('div');
  title.className = 'cal-detail-title';
  const selNet = selOps.reduce((s, { p }) => s + (p.type === 'income' ? p.amount : -p.amount), 0);
  title.innerHTML = `<span>${sel ? fmtDayLabel(parseKey(sel)) : ''}</span>` +
    (selOps.length ? `<span>${selNet >= 0 ? '+' : '-'}${fmtAmount(Math.abs(selNet))} €</span>` : '');
  root.appendChild(title);
  if (!selOps.length) {
    const e = document.createElement('div'); e.className = 'cal-detail-empty'; e.textContent = 'Aucune opération prévue ce jour.';
    root.appendChild(e);
  } else {
    selOps.forEach(({ p, date }) => root.appendChild(buildUpcomingRow(p, date)));
    bindUpcomingActions(root);
  }
}

const CHEVRON_SVG = '<svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function ddIsOpen(key, def) {
  if (def === undefined) def = true;
  try {
    const v = JSON.parse(localStorage.getItem('fin_dd_state') || '{}')[key];
    return v === undefined ? def : v;
  } catch (e) { return def; }
}
function ddSetOpen(key, open) {
  try {
    const s = JSON.parse(localStorage.getItem('fin_dd_state') || '{}');
    s[key] = open;
    localStorage.setItem('fin_dd_state', JSON.stringify(s));
  } catch (e) {}
}
function applyDropdown(ddEl, open) {
  ddEl.classList.toggle('collapsed', !open);
  ddEl.firstElementChild.setAttribute('aria-expanded', String(open));
}
function bindDropdown(ddEl, key, def) {
  applyDropdown(ddEl, ddIsOpen(key, def));
  ddEl.firstElementChild.onclick = () => {
    const open = ddEl.classList.contains('collapsed');
    applyDropdown(ddEl, open);
    ddSetOpen(key, open);
  };
}

function buildUpcomingGroup(type, items) {
  const isIncome = type === 'income';
  const subtotal = items.reduce((s, { p }) => s + p.amount, 0);
  const dd = document.createElement('div');
  dd.className = 'dd dd-sub ' + type;
  dd.innerHTML = `
    <button type="button" class="dd-header" aria-expanded="true">
      <span class="dd-title"><span class="dd-dot"></span>${isIncome ? 'Recettes' : 'Dépenses'}<span class="dd-count">${items.length}</span></span>
      <span class="dd-right"><span class="dd-total ${isIncome ? 'pos' : 'neg'}">${isIncome ? '+' : '-'}${fmtAmount(subtotal)} €</span>${CHEVRON_SVG}</span>
    </button>
    <div class="dd-collapse"><div class="dd-inner"></div></div>`;
  const inner = dd.querySelector('.dd-inner');
  items.forEach(({ p, date }) => inner.appendChild(buildUpcomingRow(p, date)));
  bindDropdown(dd, 'upcoming-' + type);
  return dd;
}

function buildUpcomingRow(p, date) {
  const cat = findCat(p.cat);
  let badgeHtml;
  if (date === todayKey()) badgeHtml = `<span class="badge today">Aujourd'hui</span>`;
  else if (date < todayKey()) badgeHtml = `<span class="badge late">En retard</span>`;
  else badgeHtml = `<span>${parseKey(date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span>`;
  const amtClass = p.type === 'income' ? 'up-amt income' : 'up-amt';
  const sign = p.type === 'income' ? '+' : '-';
  const row = document.createElement('div');
  row.className = 'upcoming-row';
  row.innerHTML = `
    <div class="cat-dot">${cat.icon}</div>
    <div class="up-info">
      <div class="up-label">${escapeHtml(p.label || cat.label)}</div>
      <div class="up-meta">${badgeHtml}<span class="badge">${REC_LABELS[p.recurrence]}</span></div>
    </div>
    <div class="up-actions">
      <div class="${amtClass}">${sign}${fmtAmount(p.amount)} €</div>
      <div class="mini-actions">
        <button class="mini-btn edit" data-id="${p.id}">Modifier</button>
        <button class="mini-btn pay" data-id="${p.id}" data-date="${date}">Réalisé</button>
        <button class="mini-btn del" data-id="${p.id}">Suppr.</button>
      </div>
    </div>`;
  return row;
}

function renderHistory(monthTx) {
  const listEl = document.getElementById('historyList');

  const net = monthTx.reduce((s, t) => s + signedAmount(t), 0);
  const totalEl = document.getElementById('historyTotal');
  totalEl.textContent = (net >= 0 ? '+' : '-') + fmtAmount(Math.abs(net)) + ' €';
  totalEl.className = 'dd-total ' + (net >= 0 ? 'pos' : 'neg');
  document.getElementById('historyCount').textContent = monthTx.length;
  if (monthTx.length === 0) { listEl.innerHTML = `<div class="empty-state">Aucune opération ce mois-ci.</div>`; return; }

  const byDay = {};
  monthTx.forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
  const dayKeys = Object.keys(byDay).sort((a,b) => b.localeCompare(a));

  listEl.innerHTML = '';
  dayKeys.forEach(key => {
    const d = parseKey(key);
    const dayTx = byDay[key].sort((a,b) => b.ts - a.ts);
    const net = dayTx.reduce((s,t) => s + signedAmount(t), 0);
    const dd = document.createElement('div');
    dd.className = 'dd dd-day';
    dd.innerHTML = `
      <button type="button" class="dd-header" aria-expanded="false">
        <span class="dd-title">${fmtDayLabel(d)}<span class="dd-count">${dayTx.length}</span></span>
        <span class="dd-right"><span class="dd-total ${net>=0?'pos':'neg'}">${net>=0?'+':'-'}${fmtAmount(Math.abs(net))} €</span>${CHEVRON_SVG}</span>
      </button>
      <div class="dd-collapse"><div class="dd-inner"></div></div>`;
    const group = dd.querySelector('.dd-inner');
    dayTx.forEach(t => {
      const cat = findCat(t.cat);
      const time = new Date(t.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const amtClass = t.type === 'income' ? 'tx-amt income' : 'tx-amt';
      const sign = t.type === 'income' ? '+' : '-';
      const row = document.createElement('div');
      row.className = 'tx-row';
      row.innerHTML = `
        <div class="cat-dot">${cat.icon}</div>
        <div class="tx-info">
          <div class="tx-cat">${cat.label}${t.note ? ' <span style="color:var(--text-faint)">· ' + escapeHtml(t.note) + '</span>' : ''}</div>
          <div class="tx-time">${time}</div>
        </div>
        <div class="${amtClass}">${sign}${fmtAmount(t.amount)} €</div>
        <button class="del-btn" data-id="${t.id}">✕</button>`;
      group.appendChild(row);
    });
    bindDropdown(dd, 'day-' + key, key === todayKey());
    listEl.appendChild(dd);
  });
  listEl.querySelectorAll('.del-btn').forEach(btn => btn.onclick = () => deleteTx(btn.dataset.id));
}

async function deleteTx(id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;
  state.transactions = state.transactions.filter(x => x.id !== id);
  await saveTransactions();
  state.balanceStart -= signedAmount(t);
  await saveBalance();
  renderActive();
  showToast('Supprimé');
}
async function markDone(id, occDate) {
  const p = state.scheduled.find(x => x.id === id);
  if (!p) return;
  const dateToUse = occDate || p.nextDate;
  const tx = {
    id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
    type: p.type, amount: p.amount, cat: p.cat, note: p.label,
    date: dateToUse, ts: parseKey(dateToUse).getTime() + 43200000,
  };
  state.transactions.push(tx);
  await saveTransactions();
  state.balanceStart += signedAmount(tx);
  await saveBalance();
  if (p.recurrence === 'once') {
    state.scheduled = state.scheduled.filter(x => x.id !== id);
  } else {
    const advanced = advanceDate(dateToUse, p.recurrence);
    if (advanced > p.nextDate) p.nextDate = advanced;
  }
  await saveScheduled();
  renderActive();
  showToast('Opération réalisée');
}
async function deleteScheduled(id) {
  state.scheduled = state.scheduled.filter(x => x.id !== id);
  await saveScheduled();
  renderActive();
  showToast('Supprimé');
}

function openBalanceEdit() {
  document.getElementById('balanceEditInput').value = String(state.balanceStart).replace('.', ',');
  document.getElementById('balanceEditRow').style.display = 'block';
  setTimeout(() => document.getElementById('balanceEditInput').focus(), 50);
}
function closeBalanceEdit() {
  document.getElementById('balanceEditRow').style.display = 'none';
}
async function confirmBalanceEdit() {
  const raw = document.getElementById('balanceEditInput').value;
  const val = parseFloat(String(raw).replace(',', '.'));
  if (isNaN(val)) { showToast('Montant invalide'); return; }
  state.balanceStart = val;
  await saveBalance();
  closeBalanceEdit();
  renderAccount();
  showToast('Solde mis à jour');
}

// ---------- CATEGORIES TAB ----------
function renderCategories() {
  document.getElementById('catMonthLabel').textContent = fmtMonthLabel(state.catMonth);
  const y = state.catMonth.getFullYear(), m = state.catMonth.getMonth();
  const inMonth = (t) => { const d = parseKey(t.date); return d.getFullYear()===y && d.getMonth()===m; };

  const expenseTx = state.transactions.filter(t => t.type==='expense' && inMonth(t));
  const incomeTx = state.transactions.filter(t => t.type==='income' && inMonth(t));

  renderDonutChart(expenseTx, 'donut', 'donutTotal', 'legendList', 'Aucune dépense ce mois-ci.');
  renderDonutChart(incomeTx, 'donutIncome', 'donutIncomeTotal', 'legendListIncome', 'Aucune recette ce mois-ci.');
}

function darkenColor(hex, factor = 0.72) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const r = Math.round(((n >> 16) & 255) * factor);
  const g = Math.round(((n >> 8) & 255) * factor);
  const b = Math.round((n & 255) * factor);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function renderDonutChart(txList, donutId, totalId, legendId, emptyMsg) {
  const total = txList.reduce((s,t) => s+t.amount, 0);
  document.getElementById(totalId).textContent = total > 0 ? Math.round(total) + ' €' : '0 €';

  const byCat = {};
  txList.forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + t.amount; });
  const entries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  const donut = document.getElementById(donutId);
  const legend = document.getElementById(legendId);
  if (entries.length === 0 || total === 0) {
    donut.style.background = 'var(--bg-elevated)';
    legend.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
    return;
  }

  let acc = 0;
  const stops = entries.map(([catId, amt]) => {
    const cat = findCat(catId);
    const start = (acc / total) * 360;
    acc += amt;
    const end = (acc / total) * 360;
    return `${darkenColor(cat.color)} ${start}deg ${end}deg`;
  });
  donut.style.background = `conic-gradient(${stops.join(', ')})`;

  legend.innerHTML = '';
  entries.forEach(([catId, amt]) => {
    const cat = findCat(catId);
    const pct = Math.round((amt/total)*100);
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <span class="legend-dot" style="background:${darkenColor(cat.color)}"></span>
      <span class="legend-ic">${cat.icon}</span>
      <span class="legend-lb">${cat.label}</span>
      <span class="legend-pct">${pct}%</span>
      <span class="legend-amt">${fmtAmount(amt)} €</span>`;
    legend.appendChild(row);
  });
}

// ---------- Sheet: new operation ----------
function buildCatGrid(gridEl, type, selectedId, onSelect) {
  gridEl.innerHTML = '';
  catsFor(type).forEach(cat => {
    const btn = document.createElement('div');
    btn.className = 'cat-btn' + (cat.id === selectedId ? ' selected' : '');
    btn.innerHTML = `<span class="ic">${cat.icon}</span><span class="lb">${cat.label}</span>`;
    btn.onclick = () => {
      gridEl.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      onSelect(cat.id);
    };
    gridEl.appendChild(btn);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'cat-btn add-cat';
  addBtn.innerHTML = `<span class="ic">➕</span><span class="lb">Perso</span>`;
  addBtn.onclick = () => openCustomCatForm(gridEl, type, onSelect);
  gridEl.appendChild(addBtn);
}
function openCustomCatForm(gridEl, type, onSelect) {
  if (gridEl.parentElement.querySelector('.custom-cat-form')) return;
  const form = document.createElement('div');
  form.className = 'custom-cat-form';
  form.innerHTML = `
    <input type="text" class="text-field" id="customCatInput" placeholder="Nom de la catégorie" style="margin-bottom:8px;" maxlength="18">
    <div style="display:flex; gap:8px;">
      <button class="btn-cancel" style="flex:1; padding:11px;" id="customCatCancel">Annuler</button>
      <button class="btn-save" style="flex:1; padding:11px;" id="customCatSave">Ajouter</button>
    </div>`;
  gridEl.insertAdjacentElement('afterend', form);
  const input = form.querySelector('#customCatInput');
  setTimeout(() => input.focus(), 50);
  form.querySelector('#customCatCancel').onclick = () => form.remove();
  form.querySelector('#customCatSave').onclick = async () => {
    const label = input.value.trim();
    if (!label) { showToast('Indiquez un nom'); return; }
    const list = catsFor(type);
    const color = CUSTOM_CAT_COLORS[list.length % CUSTOM_CAT_COLORS.length];
    const id = 'custom_' + type + '_' + Date.now().toString(36);
    const newCat = { id, label, icon: '🏷️', color };
    list.push(newCat);
    await saveCatsFor(type);
    form.remove();
    buildCatGrid(gridEl, type, id, onSelect);
    onSelect(id);
    showToast('Catégorie ajoutée');
  };
}
function updateAnticipNote() {
  const date = document.getElementById('dateInput').value;
  const rec = document.getElementById('recSelect').value;
  const note = document.getElementById('anticipNote');
  if (rec !== 'once') {
    note.textContent = `Sera ajoutée comme opération à venir (${REC_LABELS[rec].toLowerCase()}), visible dans « Opérations à venir » jusqu'à sa réalisation.`;
  } else if (date > todayKey()) {
    note.textContent = `Date future : cette opération sera enregistrée comme anticipée, dans « Opérations à venir ».`;
  } else {
    note.textContent = '';
  }
}
function updateSaveState() {
  const amount = parseFloat(document.getElementById('amountInput').value.replace(',', '.'));
  document.getElementById('saveBtn').classList.toggle('btn-save-dim', !(amount > 0 && state.selectedCat));
}
function setType(type) {
  state.selectedType = type;
  state.selectedCat = null;
  document.querySelectorAll('#typeToggle .type-btn').forEach(b => b.classList.toggle('selected', b.dataset.type === type));
  buildCatGrid(document.getElementById('catGrid'), type, null, (id) => { state.selectedCat = id; updateSaveState(); });
  updateSaveState();
}
function openSheet(editId) {
  const p = typeof editId === 'string' ? state.scheduled.find(x => x.id === editId) : null;
  state.editingId = p ? p.id : null;
  document.getElementById('saveBtn').textContent = p ? 'Mettre à jour' : 'Enregistrer';
  document.getElementById('amountInput').value = p ? String(p.amount).replace('.', ',') : '';
  document.getElementById('noteInput').value = p ? (p.label || '') : '';
  document.getElementById('dateInput').value = p ? p.nextDate : todayKey();
  document.getElementById('recSelect').value = p ? p.recurrence : 'once';
  updateAnticipNote();
  setType(p ? p.type : 'expense');
  if (p) {
    state.selectedCat = p.cat;
    buildCatGrid(document.getElementById('catGrid'), p.type, p.cat, (id) => { state.selectedCat = id; updateSaveState(); });
    updateSaveState();
  }
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('amountInput').focus(), 150);
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('amountInput').blur();
  state.editingId = null;
  document.getElementById('saveBtn').textContent = 'Enregistrer';
}

// ---------- Manage categories ----------
function openManageCats() {
  renderManageCats();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheetManageCats').classList.add('open');
}
function closeManageCats() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheetManageCats').classList.remove('open');
}
function closeAnySheet() {
  closeSheet();
  closeManageCats();
}

function renderManageCats() {
  renderManageCatList('expense', document.getElementById('manageCatListExpense'));
  renderManageCatList('income', document.getElementById('manageCatListIncome'));
}

function renderManageCatList(type, container) {
  const list = catsFor(type);
  container.innerHTML = '';
  list.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'manage-cat-row';
    row.innerHTML = `
      <span class="ic">${cat.icon}</span>
      <span class="lb">${escapeHtml(cat.label)}</span>
      <button class="icon-btn" data-action="edit" title="Renommer">✎</button>
      <button class="icon-btn danger" data-action="delete" title="Supprimer">🗑</button>`;
    row.querySelector('[data-action="edit"]').onclick = () => startEditCat(type, cat.id, container);
    row.querySelector('[data-action="delete"]').onclick = () => startDeleteCat(type, cat.id, container);
    container.appendChild(row);
  });
}

function startEditCat(type, catId, container) {
  renderManageCatList(type, container); // reset any other open row first
  const list = catsFor(type);
  const cat = list.find(c => c.id === catId);
  if (!cat) return;
  const rows = container.querySelectorAll('.manage-cat-row');
  const idx = list.findIndex(c => c.id === catId);
  const targetRow = rows[idx];
  const editRow = document.createElement('div');
  editRow.className = 'manage-cat-edit-row';
  editRow.innerHTML = `
    <span class="ic">${cat.icon}</span>
    <input type="text" class="text-field" value="${escapeHtml(cat.label)}" maxlength="18" style="margin-bottom:0;">
    <button class="icon-btn" data-action="save" title="Valider">✓</button>
    <button class="icon-btn" data-action="cancel" title="Annuler">✕</button>`;
  targetRow.replaceWith(editRow);
  const input = editRow.querySelector('input');
  setTimeout(() => { input.focus(); input.select(); }, 30);
  editRow.querySelector('[data-action="cancel"]').onclick = () => renderManageCatList(type, container);
  editRow.querySelector('[data-action="save"]').onclick = async () => {
    const newLabel = input.value.trim();
    if (!newLabel) { showToast('Indiquez un nom'); return; }
    cat.label = newLabel;
    await saveCatsFor(type);
    renderManageCatList(type, container);
    renderActive();
    showToast('Catégorie renommée');
  };
}

function startDeleteCat(type, catId, container) {
  const list = catsFor(type);
  if (list.length <= 1) { showToast('Il faut garder au moins une catégorie'); return; }
  renderManageCatList(type, container);
  const cat = list.find(c => c.id === catId);
  if (!cat) return;
  const idx = list.findIndex(c => c.id === catId);
  const rows = container.querySelectorAll('.manage-cat-row');
  const targetRow = rows[idx];
  const confirmRow = document.createElement('div');
  confirmRow.className = 'manage-cat-confirm-row';
  confirmRow.innerHTML = `
    <span class="msg">Supprimer "${escapeHtml(cat.label)}" ?</span>
    <button class="confirm-no" data-action="no">Annuler</button>
    <button class="confirm-yes" data-action="yes">Supprimer</button>`;
  targetRow.replaceWith(confirmRow);
  confirmRow.querySelector('[data-action="no"]').onclick = () => renderManageCatList(type, container);
  confirmRow.querySelector('[data-action="yes"]').onclick = async () => {
    const newList = catsFor(type).filter(c => c.id !== catId);
    if (type === 'income') state.incomeCats = newList; else state.expenseCats = newList;
    await saveCatsFor(type);
    renderManageCatList(type, container);
    renderActive();
    showToast('Catégorie supprimée');
  };
}

async function saveOperation() {
  const amount = parseFloat(document.getElementById('amountInput').value.replace(',', '.'));
  if (!(amount > 0)) { showToast('Indiquez un montant'); return; }
  if (!state.selectedCat) { showToast('Choisissez une catégorie'); return; }
  const note = document.getElementById('noteInput').value.trim();
  const date = document.getElementById('dateInput').value || todayKey();
  const rec = document.getElementById('recSelect').value;
  const now = new Date();

  if (state.editingId) {
    const item = state.scheduled.find(x => x.id === state.editingId);
    if (item) {
      Object.assign(item, { type: state.selectedType, label: note, amount, cat: state.selectedCat, nextDate: date, recurrence: rec });
      await saveScheduled();
      showToast('Opération modifiée');
    }
    closeSheet();
    switchTab('account');
    return;
  }

  if (rec === 'once' && date <= todayKey()) {
    const tx = {
      id: 't' + now.getTime() + Math.random().toString(36).slice(2,7),
      type: state.selectedType, amount, cat: state.selectedCat, note,
      date, ts: date === todayKey() ? now.getTime() : parseKey(date).getTime() + 43200000,
    };
    state.transactions.push(tx);
    await saveTransactions();
    state.balanceStart += signedAmount(tx);
    await saveBalance();
    showToast(state.selectedType === 'income' ? 'Recette ajoutée' : 'Dépense ajoutée');
  } else {
    const item = {
      id: 'p' + now.getTime() + Math.random().toString(36).slice(2,7),
      type: state.selectedType, label: note, amount, cat: state.selectedCat,
      nextDate: date, recurrence: rec,
    };
    state.scheduled.push(item);
    await saveScheduled();
    showToast('Opération anticipée ajoutée');
  }
  closeSheet();
  switchTab('account');
}

// ---------- Init ----------
async function init() {
  document.querySelectorAll('#typeToggle .type-btn').forEach(btn => btn.onclick = () => setType(btn.dataset.type));

  await loadAll();
  renderActive();

  document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));

  document.getElementById('monthPrev').onclick = () => { state.viewMonth.setMonth(state.viewMonth.getMonth()-1); renderAccount(); };
  document.getElementById('monthNext').onclick = () => { state.viewMonth.setMonth(state.viewMonth.getMonth()+1); renderAccount(); };
  document.getElementById('catMonthPrev').onclick = () => { state.catMonth.setMonth(state.catMonth.getMonth()-1); renderCategories(); };
  document.getElementById('catMonthNext').onclick = () => { state.catMonth.setMonth(state.catMonth.getMonth()+1); renderCategories(); };

  document.getElementById('openSheetBtn').onclick = () => openSheet();
  document.getElementById('cancelBtn').onclick = closeSheet;
  document.getElementById('overlay').onclick = closeAnySheet;
  document.getElementById('saveBtn').onclick = saveOperation;
  document.getElementById('amountInput').addEventListener('input', updateSaveState);
  document.getElementById('dateInput').addEventListener('input', updateAnticipNote);
  document.getElementById('recSelect').addEventListener('change', updateAnticipNote);
  document.getElementById('editBalanceBtn').onclick = openBalanceEdit;
  document.getElementById('balanceEditCancel').onclick = closeBalanceEdit;
  document.getElementById('balanceEditSave').onclick = confirmBalanceEdit;

  document.getElementById('manageCatsBtn').onclick = openManageCats;
  document.getElementById('manageCatsCloseBtn').onclick = closeManageCats;
}

init();
</script>
